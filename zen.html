<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zen Math">
<title>Zen — Math</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2334b3e0'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'%3EZ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1b2e; --card:#17273f; --card2:#1e3350; --ink:#f2f7ff; --dim:#9db4d0;
  --line:#2b4364; --sky:#4fc3f7; --grass:#5ddba0; --sun:#ffc94d; --warm:#ff9a76;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:radial-gradient(900px 600px at 15% -10%,#1d3a63 0%,transparent 60%),
     radial-gradient(700px 500px at 105% 5%,#1b4d55 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.screen{display:none;flex:1;flex-direction:column;padding:14px 16px calc(24px + var(--safe-b));animation:fade .25s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- bottom menu, same shape as Cheyenne's ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;
  background:rgba(15,27,46,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe-b));z-index:40}
.nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:10.5px;
  font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
.nav button i{font-style:normal;font-size:21px;line-height:1}
.nav button.on{color:var(--sky)}
body.hidenav .nav{display:none}
.screen{padding-bottom:calc(96px + var(--safe-b))}
.chipbar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.chipbar button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.chipbar button.on{background:var(--sky);color:#0d2033;border-color:var(--sky)}
.chipbar button.soon{opacity:.55}
/* ---------- flashcards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;min-height:250px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;
  cursor:pointer;text-align:center;position:relative;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.card .face{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.card .face.word{font-size:23px;line-height:1.4}
.card .ans{font-size:60px;font-weight:800;color:var(--grass);font-variant-numeric:tabular-nums}
.card .sub{font-size:15px;line-height:1.5;color:var(--dim);margin-top:14px;max-width:300px}
.card .flip{position:absolute;bottom:12px;font-size:11.5px;color:var(--dim);letter-spacing:.5px;font-weight:700}
.cardnav{display:flex;gap:10px;margin-top:14px}
.cardnav button{flex:1}
/* ---------- speed game ---------- */
.clock{display:flex;gap:10px;margin-bottom:14px}
.clockbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.clockbox b{display:block;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.clockbox span{font-size:10px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase;font-weight:800}
.streakpop{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-size:44px;font-weight:800;
  color:var(--sun);pointer-events:none;z-index:50;animation:whoosh .7s ease forwards}
@keyframes whoosh{0%{opacity:0;transform:translateX(-50%) scale(.5)}
  25%{opacity:1;transform:translateX(-50%) scale(1.1)}
  100%{opacity:0;transform:translateX(-50%) scale(1.3) translateY(-40px)}}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:800}
.top h2{font-size:16px;margin:0;flex:1;font-weight:800}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 auto;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:17px;border-radius:18px;
  border:none;font-size:17.5px;font-weight:800;cursor:pointer;color:#0d2033;
  background:linear-gradient(135deg,var(--sky),var(--grass));
  box-shadow:0 6px 0 #1f6d8c,0 10px 20px rgba(79,195,247,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f6d8c}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 #101d31}
.btn.sm{padding:13px;font-size:15px;border-radius:15px}
.teach-wrap{display:flex;gap:13px;align-items:flex-start;margin:2px 0 16px}
.teach{width:76px;height:76px;flex:0 0 auto;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#zArm{animation:point 2.8s ease-in-out infinite}
@keyframes point{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-11deg)}}
#zEyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;
  padding:12px 14px;font-size:14.5px;line-height:1.45;flex:1;min-height:50px;display:flex;align-items:center}
.bubble b{color:var(--sky)}
.hi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;margin-bottom:14px}
.hi b{display:block;font-size:17px;margin-bottom:4px}
.hi span{font-size:13.5px;color:var(--dim);line-height:1.5}
.unit{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px;cursor:pointer;
  color:inherit;font-family:inherit;transition:transform .08s}
.unit:active{transform:scale(.985)}
.unum{width:46px;height:46px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#0d2033;background:var(--sky)}
.utx{flex:1;min-width:0}
.utx b{display:block;font-size:15.5px;line-height:1.3}
.utx span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
.stars{font-size:13px;letter-spacing:1px;flex:0 0 auto;color:var(--sun)}
.voicebar{display:flex;gap:8px;margin-bottom:16px}
.voicebar button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;
  color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.voicebar button.on{background:var(--sky);color:#0d2033;border-color:var(--sky)}
.lesson .rule{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;
  font-size:17px;line-height:1.55;font-weight:700;margin-bottom:14px}
.lesson .ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  font-size:16px;line-height:1.7;white-space:pre-line;margin-bottom:14px;font-variant-numeric:tabular-nums}
.lesson .hook{border-left:4px solid var(--sun);padding:4px 0 4px 13px;font-size:15.5px;line-height:1.5;
  color:var(--sun);font-weight:700;margin-bottom:18px}
.readrow{display:flex;gap:10px;margin-bottom:16px}
.readrow button{flex:1}
.chant{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:16px}
.chant .lab{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:10px}
.chantrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chantrow span{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 11px;
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;transition:all .15s}
.chantrow span.lit{background:var(--sun);color:#0d2033;border-color:var(--sun);transform:scale(1.14)}
.qwrap{flex:1;display:flex;flex-direction:column}
.qcount{font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.4px;margin-bottom:8px}
.qbar{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--grass));transition:width .3s}
.qhead{display:flex;align-items:flex-start;gap:11px;margin:4px 0 14px}
.qtext{font-size:24px;line-height:1.35;font-weight:800;white-space:pre-line;flex:1;
  font-variant-numeric:tabular-nums}
.qtext.big{font-size:44px;text-align:center}
.spk{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:21px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.spk.playing{background:var(--sky);color:#0d2033;border-color:var(--sky);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pic{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px 8px;
  margin-bottom:16px;position:relative}
.pic svg{width:100%;height:auto;display:block;overflow:visible}
.pic .replay{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:11px;
  border:1px solid var(--line);background:var(--card2);color:var(--dim);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;font-size:17.5px;
  font-weight:700;text-align:left;color:inherit;font-family:inherit;cursor:pointer;transition:transform .08s;
  display:flex;align-items:center;gap:11px}
.opt:active{transform:scale(.98)}
.opt .num{width:26px;height:26px;border-radius:9px;background:var(--card2);color:var(--dim);font-size:13px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt.right{background:var(--grass);color:#0d2033;border-color:var(--grass)}
.opt.right .num{background:rgba(0,0,0,.15);color:#0d2033}
.opt.wrong{background:var(--card2);border-color:var(--warm);color:var(--warm)}
.opt.reading{border-color:var(--sky)}
.entry{background:var(--card);border:2px solid var(--line);border-radius:18px;height:72px;display:flex;
  align-items:center;justify-content:center;font-size:36px;font-weight:800;margin-bottom:12px;
  font-variant-numeric:tabular-nums;letter-spacing:2px}
.entry.right{border-color:var(--grass);color:var(--grass)}
.entry.wrong{border-color:var(--warm);color:var(--warm)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 0;
  font-size:24px;font-weight:800;color:var(--ink);font-family:inherit;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:transform .06s}
.pad button:active{transform:scale(.94);background:var(--card2)}
.pad button.go{background:linear-gradient(135deg,var(--sky),var(--grass));color:#0d2033;font-size:19px}
.why{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px;
  font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;
  animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.why b{color:var(--grass)}
.why.miss b{color:var(--warm)}
.done{align-items:center;text-align:center;justify-content:center}
.score{font-size:60px;font-weight:800;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.done p{font-size:16.5px;line-height:1.55;color:var(--dim);max-width:330px;margin:0 0 6px}
.bigstars{font-size:34px;letter-spacing:5px;color:var(--sun);margin:14px 0 20px}
.bigstars span{display:inline-block;animation:star .5s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes star{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
.missed{width:100%;text-align:left;margin-top:22px}
.missed .lab{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-weight:800;margin-bottom:9px}
.missed div.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  margin-bottom:8px;font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
.foot{margin-top:20px;font-size:12px;color:var(--dim);line-height:1.5;text-align:center}
.dot{transform-box:fill-box;transform-origin:center;animation:drop .32s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes drop{from{opacity:0;transform:scale(.2) translateY(-10px)}to{opacity:1;transform:none}}
.hop{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .42s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .3s ease backwards}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="s-home">
  <div class="top">
    <a class="iconbtn" href="index.html" title="Back">‹</a>
    <h1>Zen — Math</h1>
  </div>
<div class="teach-wrap">
  <div class="teach" id="teachArt"></div>
  <div class="bubble" id="teachSays"></div>
</div>
  <div class="chipbar" id="subjBar"></div>
  <div class="hi"><b id="hiT">Multiplication and division</b><span id="hiS"></span></div>
  <div class="voicebar" id="voiceBar"></div>
  <div id="unitList"></div>
  <p class="foot">Grade 3 · enVision Topics 1 and 2</p>
</section>

<section class="screen lesson" id="s-lesson">
  <div class="top"><button class="iconbtn" id="lBack">‹</button><h2 id="lTitle"></h2>
    <button class="iconbtn spk" id="lSpk" title="Read this to me">🔊</button></div>
  <div class="rule" id="lRule"></div>
  <div class="ex" id="lEx"></div>
  <div class="hook" id="lHook"></div>
  <div id="lChant"></div>
  <button class="btn" id="lGo">Start — 10 questions</button>
</section>

<section class="screen" id="s-round">
  <div class="top"><button class="iconbtn" id="rBack">✕</button><h2 id="rTitle"></h2></div>
  <div class="qwrap">
    <div class="qcount" id="qCount"></div>
    <div class="qbar"><i id="qBar" style="width:0%"></i></div>
    <div class="qhead">
      <div class="qtext" id="qText"></div>
      <button class="spk" id="qSpk" title="Say it again">🔊</button>
    </div>
    <div id="qPic"></div>
    <div id="qAnswer"></div>
    <div id="qWhy"></div>
  </div>
</section>

<section class="screen done" id="s-done">
  <div class="teach" id="teachArt2" style="width:86px;height:86px;margin-bottom:6px"></div>
  <div class="score" id="dScore"></div>
  <div class="bigstars" id="dStars"></div>
  <p id="dMsg"></p>
  <div class="missed" id="dMissed"></div>
  <button class="btn" id="dAgain" style="margin-top:24px">Go again</button>
  <button class="btn ghost sm" id="dHome" style="margin-top:10px">Pick something else</button>
</section>


<!-- ===================== FLASHCARDS ===================== -->
<section class="screen" id="s-cards">
  <div class="top"><button class="iconbtn" id="cBack">‹</button><h2 id="cTitle">Flashcards</h2>
    <button class="spk" id="cSpk" title="Say it again">🔊</button></div>
  <div class="qcount" id="cCount"></div>
  <div class="qbar"><i id="cBar" style="width:0%"></i></div>
  <div id="cCard"></div>
  <div class="cardnav">
    <button class="btn ghost sm" id="cPrev">‹ Back</button>
    <button class="btn sm" id="cNext">Next ›</button>
  </div>
</section>

<!-- ===================== SPEED GAME ===================== -->
<section class="screen" id="s-speed">
  <div class="top"><button class="iconbtn" id="spBack">✕</button><h2 id="spTitle">Beat the clock</h2></div>
  <div class="clock">
    <div class="clockbox"><b id="spTime">0.0</b><span>Seconds</span></div>
    <div class="clockbox"><b id="spDone">0/10</b><span>Done</span></div>
    <div class="clockbox"><b id="spBest">—</b><span>Your best</span></div>
  </div>
  <div class="qhead"><div class="qtext big" id="spText"></div></div>
  <div id="spAnswer"></div>
</section>

<!-- ===================== PICK A UNIT ===================== -->
<section class="screen" id="s-pick">
  <div class="top"><button class="iconbtn" id="pkBack">‹</button><h2 id="pkTitle"></h2></div>
  <p class="foot" id="pkSub" style="margin:0 0 14px;text-align:left"></p>
  <div id="pkList"></div>
</section>

<nav class="nav">
  <button data-nav="home" class="on"><i>🏠</i>Home</button>
  <button data-nav="cards"><i>🃏</i>Cards</button>
  <button data-nav="play"><i>🎯</i>Play</button>
  <button data-nav="speed"><i>⚡</i>Speed</button>
</nav>
</div>

const U = [{"t":"Take it away","s":"Division by subtracting the same number over and over","rule":"Keep taking the same amount away until nothing is left. The number of times you took it away is the answer.","ex":"Jason has 12 plums, 3 to a bowl.\n12 − 3 = 9, 9 − 3 = 6, 6 − 3 = 3, 3 − 3 = 0.\nHe subtracted 4 times, so he needs 4 bowls. 12 ÷ 3 = 4.","hook":"Stop at zero, then count your jumps.","q":[[0,"Start at 15. Take away 5 each time.\nHow many jumps until you reach 0?",3,"15 → 10 → 5 → 0. 3 jumps, so 15 ÷ 5 = 3.",null,["line",15,5],{"q":6,"w":7}],[0,"Start at 12. Take away 4 each time.\nHow many jumps until you reach 0?",3,"12 → 8 → 4 → 0. 3 jumps, so 12 ÷ 4 = 3.",null,["line",12,4],{"q":8,"w":9}],[0,"Start at 18. Take away 6 each time.\nHow many jumps until you reach 0?",3,"18 → 12 → 6 → 0. 3 jumps, so 18 ÷ 6 = 3.",null,["line",18,6],{"q":10,"w":11}],[0,"Start at 24. Take away 6 each time.\nHow many jumps until you reach 0?",4,"24 → 18 → 12 → 6 → 0. 4 jumps, so 24 ÷ 6 = 4.",null,["line",24,6],{"q":12,"w":13}],[0,"Start at 20. Take away 4 each time.\nHow many jumps until you reach 0?",5,"20 → 16 → 12 → 8 → 4 → 0. 5 jumps, so 20 ÷ 4 = 5.",null,["line",20,4],{"q":14,"w":15}],[0,"Start at 16. Take away 2 each time.\nHow many jumps until you reach 0?",8,"Taking 2 away from 16 lands on 0 after 8 jumps. So 16 ÷ 2 = 8.",null,["line",16,2],{"q":16,"w":17}],[0,"Start at 27. Take away 9 each time.\nHow many jumps until you reach 0?",3,"27 → 18 → 9 → 0. 3 jumps, so 27 ÷ 9 = 3.",null,["line",27,9],{"q":18,"w":19}],[0,"Start at 30. Take away 5 each time.\nHow many jumps until you reach 0?",6,"Taking 5 away from 30 lands on 0 after 6 jumps. So 30 ÷ 5 = 6.",null,["line",30,5],{"q":20,"w":21}],[0,"Start at 32. Take away 8 each time.\nHow many jumps until you reach 0?",4,"32 → 24 → 16 → 8 → 0. 4 jumps, so 32 ÷ 8 = 4.",null,["line",32,8],{"q":22,"w":23}],[0,"Start at 21. Take away 7 each time.\nHow many jumps until you reach 0?",3,"21 → 14 → 7 → 0. 3 jumps, so 21 ÷ 7 = 3.",null,[ ng rows and columns","rule":"Deal it out like cards until it is gone — every pile ends up the same size. Or line it up in a rectangle: rows × how many in each row = the total.","ex":"Jonas shares 20 cards among 4 people. Each person gets 5. 20 ÷ 4 = 5.\nThe same 20 as an array: 4 rows with 5 in each row.","hook":"\"How many groups?\" and \"how many in each group?\" are two different questions. Read which one they asked.","q":[[0,"20 cards shared between 4 people.\nHow many does each person get?",5,"Deal them out into 4 piles: 5 in each pile. 20 ÷ 4 = 5.",null,["groups",4,5],{"q":5,"w":6}],[0,"An array with 3 rows and 6 in each row.\nHow many in all?",18,"3 rows × 6 in each row = 18.",null,["array",3,6],{"q":7,"w":8}],[0,"An array with 4 rows and 5 in each row.\nHow many in all?",20,"4 rows × 5 in each row = 20.",null,["array",4,5],{"q":9,"w":10}],[0,"12 painters split into groups of 2.\nHow many groups?",6,"12 ÷ 2 = 6 groups. You are asking how many groups, not how big each one is.",null,["groups",6,2],{"q":11,"w":12}],[0,"6 groups of painters. Each group paints 3 rooms.\nHow many rooms?",18,"6 groups × 3 rooms each = 18 rooms.",null,["groups",6,3],{"q":13,"w":14}],[0,"12 painters split into groups of 2.\nEach group paints 3 rooms.\nHow many rooms in all?",18,"Two steps. First 12 ÷ 2 = 6 groups. Then 6 × 3 = 18 rooms. Do not stop after the first step.",null,["groups",6,2],{"q":15,"w":16}],[0,"18 counters shared into 3 equal groups.\nHow many in each group?",6,"18 ÷ 3 = 6 in each group.",null,["groups",3,6],{"q":17,"w":18}],[0,"8 groups with 5 counters in each.\nHow many counters?",40,"8 × 5 = 40.",null,["groups",8,5],{"q":19,"w":20}],[0,"6 groups with 9 stars in each.\nHow many stars?",54,"6 × 9 = 54.",null,["groups",6,9],{"q":21,"w":22}],[0,"42 raisins, 6 raisins per salad.\nHow many salads?",7,"42 ÷ 6 = 7 salads.",null,["groups",7,6],{"q":23,"w":24}],[0,"You save $4 a week for 8 weeks.\nHow much money?",32,"8 weeks × $4 = $32.",null,["groups",8,4],{"q":25,"w":26}] /* Every key is prefixed. Nova lives on the same origin and shares this
   localStorage — an unprefixed "progress" here would wipe Cheyenne's. */
const K = 'zen:';
const db = {
  get(k,d){ try{ const v=localStorage.getItem(K+k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }
};
let best = db.get('best', {});

/* ============================================================
   VOICE — the same baked Kokoro sprites Nova uses.
   One MP3 per unit holds every line in order; the .json says where
   each one starts. If the files aren't there we fall back to the
   device's own speech so the app is never silent.
   ============================================================ */
const VOICES = [['','Sarah'],['.bella','Bella'],['.sky','Sky']];
const Voice = (()=>{
  let suffix = db.get('voice','');
  const sprites = {};                 // "0.bella" -> {idx, buf|url}
  let ctx = null, active = null, unlocked = false;
  const TAIL = 0.12;                  // the sprite gap is 0.28s; MP3 starts a touch late

  function stop(){
    if(!active) return;
    const a = active; active = null;
    if(a.raf) cancelAnimationFrame(a.raf);
    if(a.timer) clearTimeout(a.timer);
    try{ a.src ? a.src.stop() : a.el.pause(); }catch(e){}
    if(a.after) a.after();
    document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  }
  function unlock(){
    if(unlocked) return; unlocked = true;
    try{ ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){}
  }
  function load(u){
    const key = u + suffix;
    if(sprites[key]) return sprites[key];
    const stem = 'zen' + u + suffix;
    // a voice with no track of its own borrows Sarah's rather than going quiet
    const stems = suffix ? [stem, 'zen'+u] : [stem];
    const p = stems.reduce((chain, s)=> chain.catch(()=>
        fetch(s + '.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(idx=>({idx, s}))
      ), Promise.reject(0))
      .then(({idx, s})=> fetch(s + '.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(buf=>({ idx, url: URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'})), raw: buf })));
    sprites[key] = p;
    return p;
  }
  function playClip(sp, i, after){
    const span = sp.idx[i];
    if(!span || !span[1]){ if(after) after(); return; }
    const [start, dur] = span;
    const el = new Audio(sp.url);
    el.currentTime = start;
    const endAt = start + dur + TAIL;
    const a = active = { el, after };
    // timeupdate only fires every ~250ms, which overshoots the gap and bleeds
    // into the next clip — rAF stops it on time.
    a.tick = ()=>{
      if(active !== a) return;
      if(el.ended || el.currentTime >= endAt){ stop(); return; }
      a.raf = requestAnimationFrame(a.tick);
    };
    const pr = el.play();
    if(pr && pr.catch) pr.catch(()=>{ if(active===a){ active=null; say2(i, sp, after); } });
    a.raf = requestAnimationFrame(a.tick);
    a.timer = setTimeout(()=>{ if(active===a) stop(); }, dur*1000 + 900);
  }
  function say2(i, sp, after){ if(after) after(); }
  function speakFallback(text, after){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9; u.onend = ()=>{ if(after) after(); };
      speechSynthesis.speak(u);
    }catch(e){ if(after) after(); }
  }
  return {
    unlock, stop,
    suffix(){ return suffix; },
    setVoice(s){ suffix = s; db.set('voice', s); for(const k in sprites) delete sprites[k]; },
    warm(u){ load(u).catch(()=>{}); },
    /* speak one line of unit u, by its index in that unit's sprite */
    say(u, i, text, after){
      stop(); unlock();
      load(u).then(sp=>{
        if(!sp.idx[i]) throw 0;
        playClip(sp, i, after);
      }).catch(()=> speakFallback(text, after));
    },
    /* speak several lines back to back */
    sayAll(u, items, done){
      let n = 0;
      const next = ()=>{
        if(n >= items.length){ if(done) done(); return; }
        const it = items[n++];
        setTimeout(()=> Voice.say(u, it[0], it[1], next), n===1 ? 0 : 260);
      };
      next();
    }
  };
})();
document.body.addEventListener('pointerdown', function once(){ Voice.unlock(); }, {once:true});

/* ============================================================
   PICTURES — drawn from the numbers in the question, and animated.
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const n = document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function drawPic(spec, host){
  host.innerHTML = '';
  if(!spec) return false;
  const [kind, a, b] = spec;
  const svg = el('svg', {viewBox:'0 0 320 140', role:'img'});
  if(kind === 'line')   linePic(svg, a, b);
  if(kind === 'array')  arrayPic(svg, a, b);
  if(kind === 'groups') groupsPic(svg, a, b);
  host.appendChild(svg);
  return true;
}
/* number line: start at the total, hop back one step at a time to zero */
function linePic(svg, total, step){
  const jumps = Math.floor(total/step);
  const L = 22, R = 298, y = 96;
  const x = v => L + (R-L) * (v/total);
  svg.appendChild(el('line', {x1:L, y1:y, x2:R, y2:y, stroke:'#2b4364', 'stroke-width':3, 'stroke-linecap':'round'}));
  for(let v=0; v<=total; v+=step){
    svg.appendChild(el('line', {x1:x(v), y1:y-6, x2:x(v), y2:y+6, stroke:'#5a7699', 'stroke-width':2}));
    const t = el('text', {x:x(v), y:y+24, fill:'#9db4d0', 'font-size':12, 'text-anchor':'middle',
      'font-family':'system-ui, sans-serif', 'font-weight':'700'});
    t.textContent = v; svg.appendChild(t);
  }
  for(let j=0; j<jumps; j++){
    const from = total - j*step, to = from - step;
    const x1 = x(from), x2 = x(to), mid = (x1+x2)/2, h = Math.min(46, 16 + (x1-x2)*0.5);
    const d = `M ${x1} ${y-8} Q ${mid} ${y-8-h} ${x2} ${y-8}`;
    const p = el('path', {d, fill:'none', stroke:'#4fc3f7', 'stroke-width':3, 'stroke-linecap':'round'});
    p.classList.add('hop');
    const len = Math.abs(x1-x2) * 1.6 + h;
    p.style.setProperty('--len', len);
    p.style.animationDelay = (0.15 + j*0.42) + 's';
    svg.appendChild(p);
    const c = el('circle', {cx:x2, cy:y, r:6, fill:'#4fc3f7'});
    c.classList.add('dot'); c.style.animationDelay = (0.45 + j*0.42) + 's';
    svg.appendChild(c);
    const lab = el('text', {x:mid, y:y-16-h, fill:'#ffc94d', 'font-size':13, 'text-anchor':'middle',
      'font-family':'system-ui, sans-serif', 'font-weight':'800'});
    lab.textContent = j+1;
    lab.classList.add('fadein'); lab.style.animationDelay = (0.45 + j*0.42) + 's';
    svg.appendChild(lab);
  }
}
/* array: rows fill in one after another */
function arrayPic(svg, rows, cols){
  const maxW = 268, maxH = 96;
  const gap = Math.min(26, maxW/Math.max(cols,1), maxH/Math.max(rows,1));
  const r = Math.max(4, Math.min(9, gap*0.34));
  const w = (cols-1)*gap, h = (rows-1)*gap;
  const ox = 160 - w/2, oy = 66 - h/2;
  for(let i=0;i<rows;i++){
    for(let j=0;j<cols;j++){
      const c = el('circle', {cx:ox+j*gap, cy:oy+i*gap, r, fill:'#4fc3f7'});
      c.classList.add('dot');
      c.style.animationDelay = (0.1 + i*0.16 + j*0.02) + 's';
      svg.appendChild(c);
    }
  }
  const t = el('text', {x:160, y:132, fill:'#9db4d0', 'font-size':13, 'text-anchor':'middle',
    'font-family':'system-ui, sans-serif', 'font-weight':'700'});
  t.textContent = rows + ' rows of ' + cols;
  svg.appendChild(t);
}
/* groups: rings that fill up, one group at a time */

/* ============================================================
   BEAT THE CLOCK — plain facts only, timed, no reading needed.
   Speed is the point of the tables, so this is the drill that
   actually builds the thing enVision is after.
   ============================================================ */
let bestTime = db.get('bestTime', {});
let SP = null, spTimer = null;
function startSpeed(i){
  CUR = i;
  // word problems don't belong in a speed run — short facts only
  const facts = U[i].q.filter(q=> q[0]===0 && q[1].length <= 10);
  const pool = facts.length >= 6 ? facts : U[i].q.filter(q=>q[0]===0);
  SP = { qs: pick(pool, Math.min(10, pool.length)), n:0, t0:Date.now(), typed:'', streak:0 };
  document.getElementById('spTitle').textContent = U[i].t;
  document.getElementById('spBest').textContent = bestTime[i] ? bestTime[i].toFixed(1) : '—';
  go('speed');
  clearInterval(spTimer);
  spTimer = setInterval(()=>{
    if(!SP) return;
    document.getElementById('spTime').textContent = ((Date.now()-SP.t0)/1000).toFixed(1);
  }, 100);
  renderSpeed();
}
function renderSpeed(){
  const q = SP.qs[SP.n];
  SP.typed = '';
  document.getElementById('spDone').textContent = SP.n + '/' + SP.qs.length;
  document.getElementById('spText').textContent = q[1];
  document.getElementById('spAnswer').innerHTML =
    `<div class="entry" id="spEntry">–</div><div class="pad">` +
    [1,2,3,4,5,6,7,8,9].map(n=>`<button data-s="${n}">${n}</button>`).join('') +
    `<button data-s="del">⌫</button><button data-s="0">0</button>
     <button class="go" data-s="ok">Go</button></div>`;
  document.querySelectorAll('[data-s]').forEach(b=> b.onclick = ()=> speedKey(b.dataset.s));
}
function speedKey(k){
  const q = SP.qs[SP.n], e = document.getElementById('spEntry');
  if(k === 'del') SP.typed = SP.typed.slice(0,-1);
  else if(k === 'ok'){ checkSpeed(); return; }
  else if(SP.typed.length < 4) SP.typed += k;
  e.textContent = SP.typed === '' ? '–' : SP.typed;
  // as soon as the digits could be right, check — no extra button press
  if(SP.typed !== '' && String(q[2]).length === SP.typed.length) checkSpeed();
}
function checkSpeed(){
  const q = SP.qs[SP.n], e = document.getElementById('spEntry');
  if(SP.typed === '') return;
  if(+SP.typed === q[2]){
    SP.streak++;
    e.classList.add('right');
    if(SP.streak >= 3) popStreak(SP.streak);
    setTimeout(()=>{
      SP.n++;
      if(SP.n >= SP.qs.length) endSpeed(); else renderSpeed();
    }, 190);
  } else {
    SP.streak = 0;
    e.classList.add('wrong');
    e.textContent = SP.typed + '  →  ' + q[2];
    setTimeout(()=>{
      SP.n++;
      if(SP.n >= SP.qs.length) endSpeed(); else renderSpeed();
    }, 1100);
  }
}
function popStreak(n){
  const d = document.createElement('div');
  d.className = 'streakpop'; d.textContent = n + ' in a row';
  d.style.fontSize = '26px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 750);
}
function endSpeed(){
  clearInterval(spTimer);
  const secs = (Date.now()-SP.t0)/1000;
  const prev = bestTime[CUR];
  const beat = !prev || secs < prev;
  if(beat){ bestTime[CUR] = Math.round(secs*10)/10; db.set('bestTime', bestTime); }
  db.set('last', new Date().toISOString().slice(0,10));
  db.set('rounds', (db.get('rounds',0)|0) + 1);
  document.getElementById('dScore').textContent = secs.toFixed(1) + 's';
  document.getElementById('dStars').innerHTML = beat ? '⚡' : '';
  document.getElementById('dMsg').textContent = beat
    ? (prev ? `New best — you took ${(prev-secs).toFixed(1)} seconds off.` : 'That is your time to beat now.')
    : `Your best is still ${prev.toFixed(1)}s. Close one.`;
  document.getElementById('dMissed').innerHTML = '';
  SPEED_LAST = true;
  go('done');
}
let SPEED_LAST = false;

/* ---------------- a round ---------------- */
let R = null, typed = '';
function pick(arr, n){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0, n);
}
function startRound(i){
  CUR = i; SPEED_LAST = false;
  R = { qs: pick(U[i].q, Math.min(10, U[i].q.length)), n:0, right:0, missed:[], locked:false };
  document.getElementById('rTitle').textContent = U[i].t;
  go('round'); renderQ();
}
document.getElementById('rBack').onclick  = ()=>{ Voice.stop(); openPicker('quest'); };
document.getElementById('spBack').onclick = ()=>{ clearInterval(spTimer); SP=null; openPicker('speed'); };
document.getElementById('qSpk').onclick  = ()=> readQuestion();

function readQuestion(){
  const q = R.qs[R.n], a = q[6];
  const btn = document.getElementById('qSpk');
  btn.classList.add('playing');
  const items = [[a.q, q[1].replace(/\n/g,' ')]];
  // he can't read the choices either, so they get read out and lit up in turn
  if(q[0] === 1 && a.o) q[4].forEach((o,i)=> items.push([a.o[i], o, i]));
  let step = 0;
  const orig = Voice.sayAll;
  (function run(){
    if(step >= items.length){ btn.classList.remove('playing');
      document.querySelectorAll('.opt.reading').forEach(o=>o.classList.remove('reading')); return; }
    const it = items[step++];
    document.querySelectorAll('.opt.reading').forEach(o=>o.classList.remove('reading'));
    if(it.length > 2){
      const o = document.querySelector(`[data-o="${it[2]}"]`);
      if(o) o.classList.add('reading');
    }
    Voice.say(CUR, it[0], it[1], ()=> setTimeout(run, 200));
  })();
}
function renderQ(){
  const q = R.qs[R.n];
  R.locked = false; typed = '';
  document.getElementById('qCount').textContent = `Question ${R.n+1} of ${R.qs.length}`;
  document.getElementById('qBar').style.width = (R.n / R.qs.length * 100) + '%';
  const tx = document.getElementById('qText');
  tx.textContent = q[1];
  tx.className = 'qtext' + (q[1].length <= 8 ? ' big' : '');
  document.getElementById('qWhy').innerHTML = '';

  const pic = document.getElementById('qPic');
  pic.innerHTML = '';
  if(q[5]){
    const wrap = document.createElement('div'); wrap.className = 'pic';
    const holder = document.createElement('div');
    wrap.appendChild(holder);
    const rp = document.createElement('button');
    rp.className = 'replay'; rp.textContent = '↻'; rp.title = 'Show it again';
    rp.onclick = ()=> drawPic(q[5], holder);
    wrap.appendChild(rp);
    pic.appendChild(wrap);
    drawPic(q[5], holder);
  }

  const box = document.getElementById('qAnswer');
  if(q[0] === 1){
    box.innerHTML = `<div class="opts">` + q[4].map((o,i)=>
      `<button class="opt" data-o="${i}"><span class="num">${i+1}</span><span>${o}</span></button>`).join('') + `</div>`;
    box.querySelectorAll('[data-o]').forEach(b=> b.onclick = ()=> answerMC(+b.dataset.o, b));
  } else {
    box.innerHTML = `<div class="entry" id="entry">–</div><div class="pad">` +
      [1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('') +
      `<button data-k="del">⌫</button><button data-k="0">0</button>
       <button class="go" data-k="ok">Check</button></div>`;
    box.querySelectorAll('[data-k]').forEach(b=> b.onclick = ()=> key(b.dataset.k));
  }
  readQuestion();
}
function key(k){
  if(R.locked) return;
  const e = document.getElementById('entry');
  if(k === 'del') typed = typed.slice(0,-1);
  else if(k === 'ok'){ if(typed !== '') answerNum(+typed); return; }
  else if(typed.length < 4) typed += k;
  e.textContent = typed === '' ? '–' : typed;
}
function answerNum(v){
  const q = R.qs[R.n], ok = (v === q[2]);
  R.locked = true;
  const e = document.getElementById('entry');
  e.classList.add(ok ? 'right' : 'wrong');
  if(!ok) e.textContent = typed + '  →  ' + q[2];
  finish(ok, q);
}
function answerMC(i, btn){
  const q = R.qs[R.n], ok = (i === q[2]);
  if(R.locked) return;
  R.locked = true;
  btn.classList.add(ok ? 'right' : 'wrong');
  if(!ok){ const right = document.querySelector(`[data-o="${q[2]}"]`); if(right) right.classList.add('right'); }
  finish(ok, q);
}
/* Right or wrong, the one-line reason shows AND gets read out.
   That line is the lesson — a wrong answer just means he hears it again. */
function finish(ok, q){
  Voice.stop();
  if(ok) R.right++; else R.missed.push(q);
  const w = document.getElementById('qWhy');
  const lead = ok ? 'Yes.' : (q[0]===1 ? 'The answer is lit up.' : 'The answer is ' + q[2] + '.');
  w.innerHTML = `<div class="why${ok?'':' miss'}"><b>${lead}</b> ${q[3]}</div>
    <button class="btn" id="nextQ" style="margin-top:14px">${R.n+1 >= R.qs.length ? 'See how you did' : 'Next'}</button>`;
  document.getElementById('nextQ').onclick = ()=>{
    Voice.stop(); R.n++;
    if(R.n >= R.qs.length) endRound(); else renderQ();
  };
  Voice.say(CUR, q[6].w, lead + ' ' + q[3]);
  document.getElementById('nextQ').scrollIntoView({block:'nearest', behavior:'smooth'});
}

const MSG = [
  [10,'Every single one. That is the whole unit done.'],
  [8, 'Strong round. The ones you missed are the ones to look at again.'],
  [6, 'More right than wrong. Run it again and it will climb.'],
  [0, 'This one is still new. Read the box at the top again, then try another round.']
];
function endRound(){
  const n = R.right;
  if(n > (best[CUR]||0)){ best[CUR] = n; db.set('best', best); }
  db.set('last', new Date().toISOString().slice(0,10));
  db.set('rounds', (db.get('rounds',0)|0) + 1);
  db.set('right', (db.get('right',0)|0) + n);
  document.getElementById('dScore').textContent = n + ' / ' + R.qs.length;
  document.getElementById('dStars').innerHTML = starStr(n).split('')
    .map((c,i)=>`<span style="animation-delay:${0.1+i*0.16}s">${c}</span>`).join('');
  document.getElementById('dMsg').textContent = (MSG.find(m=>n>=m[0])||MSG[3])[1];
  const box = document.getElementById('dMissed');
  box.innerHTML = R.missed.length
    ? `<div class="lab">Worth another look</div>` + R.missed.map(q=>{
        const ans = q[0]===1 ? q[4][q[2]] : q[2];
        return `<div class="m"><b>${q[1].replace(/\n/g,' ')}</b> → ${ans}<br><span style="color:var(--dim)">${q[3]}</span></div>`;
      }).join('')
    : '';
  go('done');
}
document.getElementById('dAgain').onclick = ()=> SPEED_LAST ? startSpeed(CUR) : startRound(CUR);
document.getElementById('dHome').onclick  = ()=>{ Voice.stop(); renderHome(); go('home'); };

renderHome();
</script>
