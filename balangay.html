<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balangay">
<title>Balangay — Philippine History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23c9702f'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#1a1208; --card:#261c0f; --card2:#332415; --ink:#fbf3e6; --dim:#c4ac8c;
  --line:#4a3520; --sun:#f2b544; --sea:#3fa9a0; --red:#d4553f; --gold:#e8c67a;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:radial-gradient(1000px 620px at 18% -8%,#4a2f13 0%,transparent 60%),
     radial-gradient(760px 520px at 108% 4%,#123f43 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.screen{display:none;flex:1;flex-direction:column;padding:14px 16px calc(96px + var(--safe-b));animation:fade .25s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:800;letter-spacing:.2px}
.top h2{font-size:15.5px;margin:0;flex:1;font-weight:800;line-height:1.3}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 auto;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border-radius:17px;
  border:none;font-size:16.5px;font-weight:800;cursor:pointer;color:#241706;
  background:linear-gradient(135deg,var(--sun),var(--red));
  box-shadow:0 6px 0 #8a4a24,0 10px 20px rgba(242,181,68,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a4a24}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 #150e06}
.btn.sm{padding:12px;font-size:14.5px;border-radius:14px}
.hero{display:flex;gap:13px;align-items:flex-start;margin:2px 0 14px}
.mascot{width:78px;height:78px;flex:0 0 auto;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#bWave{animation:sway 5s ease-in-out infinite;transform-origin:50px 78px}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;
  padding:12px 14px;font-size:14.5px;line-height:1.45;flex:1;min-height:50px;display:flex;align-items:center}
.chipbar{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px}
.chipbar::-webkit-scrollbar{display:none}
.chipbar button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  color:var(--ink);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.chipbar button.on{background:var(--sun);color:#241706;border-color:var(--sun)}
.lvlbar{display:flex;gap:8px;margin-bottom:16px}
.lvlbar button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;
  color:var(--ink);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.lvlbar button.on{background:var(--sea);color:#08211f;border-color:var(--sea)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;cursor:pointer;
  color:inherit;font-family:inherit;transition:transform .08s}
.unit:active{transform:scale(.985)}
.unum{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#241706;background:var(--sun)}
.utx{flex:1;min-width:0}
.utx b{display:block;font-size:14.5px;line-height:1.3}
.utx span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.tagrow{display:flex;gap:5px;margin-top:5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;
  padding:2px 7px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tag.heavy{color:var(--red);border-color:#6b2f22}
.tag.rest{color:var(--sea);border-color:#20544f}
.sechead{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.9px;font-weight:800;
  margin:18px 0 9px}
.para{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;
  font-size:16.5px;line-height:1.65;cursor:pointer;transition:border-color .2s,background .2s}
.para.lit{border-color:var(--sun);background:var(--card2)}
.warn{background:#3a1c14;border:1px solid #6b2f22;border-radius:18px;padding:16px;margin-bottom:16px}
.warn b{display:block;font-size:15px;margin-bottom:6px;color:var(--red)}
.warn span{font-size:14px;line-height:1.55;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;
  cursor:pointer;text-align:center;position:relative;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.card .face{font-size:25px;font-weight:800;line-height:1.35}
.card .back{font-size:16.5px;line-height:1.6;color:var(--ink)}
.card .flip{position:absolute;bottom:12px;font-size:11px;color:var(--dim);letter-spacing:.5px;font-weight:700}
.cardnav{display:flex;gap:10px;margin-top:14px}
.cardnav button{flex:1}
.qtext{font-size:20px;line-height:1.4;font-weight:800;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;font-size:16px;
  font-weight:700;text-align:left;color:inherit;font-family:inherit;cursor:pointer;line-height:1.4;
  display:flex;gap:11px;align-items:flex-start}
.opt .num{width:24px;height:24px;border-radius:8px;background:var(--card2);color:var(--dim);font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.opt.right{background:var(--sea);color:#08211f;border-color:var(--sea)}
.opt.right .num{background:rgba(0,0,0,.16);color:#08211f}
.opt.wrong{background:var(--card2);border-color:var(--red);color:var(--red)}
.opt.reading{border-color:var(--sun)}
.why{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:14px;
  font-size:15.5px;line-height:1.6;animation:pop .3s ease}
.why b{color:var(--sea)}
.why.miss b{color:var(--red)}
.spk{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:20px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.spk.playing{background:var(--sun);color:#241706;border-color:var(--sun);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.qcount{font-size:12px;color:var(--dim);font-weight:700;margin-bottom:8px}
.qbar{height:7px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--red));transition:width .3s}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;
  background:rgba(26,18,8,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe-b));z-index:40}
.nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:10.5px;
  font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--sun)}
body.hidenav .nav{display:none}
.foot{margin-top:18px;font-size:11.5px;color:var(--dim);line-height:1.55;text-align:center}
.done{align-items:center;text-align:center;justify-content:center}
.score{font-size:56px;font-weight:800;line-height:1;margin:8px 0 12px}
</style>

<script>
/* Keys are prefixed — Nova and Zen's app share this origin's localStorage. */
const K = 'bal:';
const db = {
  get(k,d){ try{ const v=localStorage.getItem(K+k); return v==null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- the paddler ----------
   Pre-colonial Visayan seafarer: woven headband, geometric batok-style
   tattooing, an outrigger under him. The balangay the whole thing is named for. */

  <clipPath id="bin"><circle cx="50" cy="50" r="41"/></clipPath>

   <line x1="72" y1="11" x2="72" y2="14"/><line x1="72" y1="38" x2="72" y2="41"/>
   <line x1="57" y1="26" x2="60" y2="26"/><line x1="84" y1="26" x2="87" y2="26"/>
   <line x1="61.4" y1="15.4" x2="63.5" y2="17.5"/><line x1="80.5" y1="34.5" x2="82.6" y2="36.6"/>
   <line x1="82.6" y1="15.4" x2="80.5" y2="17.5"/><line x1="63.5" y1="34.5" x2="61.4" y2="36.6"/>
  </g>
  <rect x="9" y="58" width="82" height="36" fill="#2f7d78"/>
  <g id="bWave">
   <path d="M9 66 q10 -4 20 0 t20 0 t20 0 t22 0 v30 H9 Z" fill="#3fa9a0" opacity=".55"/>
   <path d="M9 72 q12 -4 24 0 t24 0 t34 0 v24 H9 Z" fill="#256b68" opacity=".6"/>
  </g>
  <!-- outrigger -->
  <path d="M18 80 h64 l-9 9 H27 Z" fill="#6b4423"/>
  <path d="M18 80 h64 l-2.4 2.4 H20.4 Z" fill="#8a5a2f"/>
  <line x1="26" y1="76" x2="14" y2="82" stroke="#6b4423" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M8 80 q6 -2 12 0 q-6 3 -12 0 Z" fill="#6b4423"/>
  <!-- paddle, gripped across the body -->
  <line x1="31" y1="78" x2="66" y2="50" stroke="#8a5a2f" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="68.6" cy="47.6" rx="4.6" ry="7" fill="#6b4423" transform="rotate(38 68.6 47.6)"/>
  <!-- torso -->
  <path d="M36 78 C36 62 41 55 50 55 C59 55 64 62 64 78 Z" fill="#a8703f"/>
  <!-- upper arm reaching to the paddle, and the hand closed round the shaft -->
  <path d="M58.5 62 L63.5 55" stroke="#a8703f" stroke-width="6.4" stroke-linecap="round"/>
  <circle cx="63.8" cy="54.4" r="3.5" fill="#96632f"/>
  <path d="M40 64 L35.6 72" stroke="#a8703f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="35.2" cy="72.6" r="3.2" fill="#96632f"/>
  <!-- batok-style banding: chevrons on the chest, rays on the shoulder -->
  <g stroke="#3d2314" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".82">
   <path d="M42 64 l4 3.6 4 -3.6 4 3.6 4 -3.6"/>
   <path d="M42 69.5 l4 3.6 4 -3.6 4 3.6 4 -3.6"/>
   <path d="M38.2 60.5 l-2.6 1.4 M38.6 63.6 l-2.8 1.3 M39 66.8 l-3 1.2"/>

   <path d="M40.6 46.4 l-1.8 1.4 M40.2 49 l-1.6 1.2"/>

 </g>
</svg>`;
document.getElementById('mascot').innerHTML = BAL_SVG;
document.getElementById('mascot2').innerHTML = BAL_SVG;

/* ---------- voice: same baked Kokoro sprites as Nova and Zen ---------- */
const VOICES = [['','Sarah'],['.bella','Bella'],['.sky','Sky']];
const Voice = (()=>{
  let suffix = db.get('voice','');
  const sprites = {}; let active = null, unlocked = false, ctx = null;
  const TAIL = 0.12;
  function stop(){
    if(!active) return;
    const a = active; active = null;
    if(a.raf) cancelAnimationFrame(a.raf);
    if(a.timer) clearTimeout(a.timer);
    try{ a.el.pause(); }catch(e){}
    document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
    document.querySelectorAll('.para.lit').forEach(p=>p.classList.remove('lit'));
  }
  function unlock(){ if(unlocked) return; unlocked = true;
    try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){} }
  function load(u){
    const key = u + suffix;
    if(sprites[key]) return sprites[key];
    const stems = suffix ? ['bal'+u+suffix, 'bal'+u] : ['bal'+u];
    sprites[key] = stems.reduce((c,s)=> c.catch(()=>
        fetch(s+'.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(idx=>({idx,s}))
      ), Promise.reject(0))
      .then(({idx,s})=> fetch(s+'.mp3').then(r=>{ if(!r.ok) throw 0; return r.blob(); })
        .then(b=>({idx, url:URL.createObjectURL(b)})));
    return sprites[key];
  }
  function fallback(text, after){
    try{ speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.rate = 0.95;
      u.onend = ()=>{ if(after) after(); }; speechSynthesis.speak(u);
    }catch(e){ if(after) after(); }
  }
  return {
    stop, unlock,
    suffix(){ return suffix; },
    setVoice(s){ suffix = s; db.set('voice', s); for(const k in sprites) delete sprites[k]; },
    warm(u){ load(u).catch(()=>{}); },
    say(u, i, text, after){
      stop(); unlock();
      load(u).then(sp=>{
        const span = sp.idx[i];
        if(!span || !span[1]) throw 0;
        const [start, dur] = span;
        const el = new Audio(sp.url); el.currentTime = start;
        const endAt = start + dur + TAIL;
        const a = active = { el };
        a.tick = ()=>{ if(active!==a) return;
          if(el.ended || el.currentTime >= endAt){ stop(); if(after) after(); return; }
          a.raf = requestAnimationFrame(a.tick); };
        const pr = el.play(); if(pr&&pr.catch) pr.catch(()=>{ if(active===a){ active=null; fallback(text, after); } });
        a.raf = requestAnimationFrame(a.tick);
        a.timer = setTimeout(()=>{ if(active===a){ stop(); if(after) after(); } }, dur*1000 + 1200);
      }).catch(()=> fallback(text, after));
    }
  };
})();
document.body.addEventListener('pointerdown', ()=>Voice.unlock(), {once:true});

/* ---------- state ---------- */
let D = null, PART = -1, LEVEL = db.get('level','adult'), CUR = 0;
const HELLO = [
  "Where our family comes from. Pick a week.",
  "Twenty-six weeks, start to now. Anywhere is fine.",
  "This is the part American textbooks skip.",
  "Pick a week. I'll read it to you."
];
function go(id){
  document.body.classList.toggle('hidenav', id==='quiz');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on');
  window.scrollTo(0,0);
}
function setNav(id){ document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav===id)); }

function renderHome(){
  setNav('home');
  document.getElementById('says').textContent = HELLO[(Math.random()*HELLO.length)|0];
  document.getElementById('partBar').innerHTML =
    `<button data-part="-1" class="${PART===-1?'on':''}">All 26</button>` +
    D.parts.map((p,i)=>`<button data-part="${i}" class="${PART===i?'on':''}">${p}</button>`).join('');
  document.getElementById('lvlBar').innerHTML = [['adult','Grown-up'],['kid','For Zen']]
    .map(([v,n])=>`<button data-lvl="${v}" class="${LEVEL===v?'on':''}">${n}</button>`).join('');
  list('unitList', u=>openRead(u.n));
}
function list(host, onPick){
  const us = D.units.filter(u=> PART<0 || u.p===PART);
  document.getElementById(host).innerHTML = us.map(u=>
    `<button class="unit" data-u="${u.n}">
       <span class="unum">${u.n}</span>
       <span class="utx"><b>${u.t}</b><span>${u.e}</span>
         <span class="tagrow">${u.heavy?'<span class="tag heavy">Hard history</span>':''}
           ${u.buffer?'<span class="tag rest">Catch-up week</span>':''}
           <span class="tag">${D.parts[u.p]}</span></span>
       </span></button>`).join('');
  document.getElementById(host).querySelectorAll('[data-u]').forEach(b=>
    b.onclick = ()=> onPick(D.units.find(x=>x.n===+b.dataset.u)));
}
document.addEventListener('click', e=>{
  const p = e.target.closest('[data-part]');
  if(p){ PART = +p.dataset.part; renderHome(); return; }
  const l = e.target.closest('[data-lvl]');
  if(l){ LEVEL = l.dataset.lvl; db.set('level', LEVEL); renderHome(); return; }
  const n = e.target.closest('[data-nav]');
  if(n){
    Voice.stop(); const id = n.dataset.nav; setNav(id);
    if(id==='home') { renderHome(); go('home'); }
    else openPicker(id);
  }
});
document.getElementById('hVoice').onclick = ()=>{
  const i = VOICES.findIndex(v=>v[0]===Voice.suffix());
  const nx = VOICES[(i+1) % VOICES.length];
  Voice.setVoice(nx[0]);
  document.getElementById('says').textContent = 'Voice: ' + nx[1] + '. Tap again to change it.';
};

const PICKER = { read:['Read','Pick a week to read or listen to.'],
                 cards:['Flashcards','The names and dates worth keeping.'],
                 quiz:['Questions','Four questions a week. No timer.'] };
let PMODE = 'read';
function openPicker(mode){
  PMODE = mode;
  document.getElementById('pkTitle').textContent = PICKER[mode][0];
  document.getElementById('pkSub').textContent = PICKER[mode][1];
  list('pkList', u=>{
    if(mode==='read') openRead(u.n);
    if(mode==='cards') openCards(u.n);
    if(mode==='quiz') openQuiz(u.n);
  });
  go('pick');
}
document.getElementById('pkBack').onclick = ()=>{ setNav('home'); renderHome(); go('home'); };

/* ---------- read along ---------- */
function unitByN(n){ return D.units.find(u=>u.n===n); }
function openRead(n){
  CUR = n; const u = unitByN(n);
  Voice.warm(n);
  document.getElementById('rTitle').textContent = u.t;
  document.getElementById('rEra').textContent = u.e + ' · week of ' + u.w;
  // the curriculum flags the units that cover atrocity; say so before he opens it with Zen
  document.getElementById('rWarn').innerHTML = u.heavy
    ? `<div class="warn"><b>Heads up before you read this together</b>
        <span>This week covers real violence. It is written plainly, not gorily, but read it
        yourself first if Zen is going to hear it.</span></div>` : '';
  const paras = (LEVEL==='kid' && u.kid.length) ? u.kid : u.nar;
  document.getElementById('rBody').innerHTML = paras.length
    ? paras.map((p,i)=>`<div class="para" data-p="${i}">${p[0]}</div>`).join('')
    : `<div class="para" style="cursor:default;color:var(--dim)">This is a catch-up week — nothing new to read. Go back over anything that didn't stick.</div>`;
  document.getElementById('rQuiz').style.display = u.quiz.length ? '' : 'none';
  document.querySelectorAll('#rBody .para').forEach(el=>{
    el.onclick = ()=> readFrom(+el.dataset.p);
  });
  go('read');
}
function readFrom(start){
  const u = unitByN(CUR);
  const paras = (LEVEL==='kid' && u.kid.length) ? u.kid : u.nar;
  const btn = document.getElementById('rSpk');
  btn.classList.add('playing');
  let i = start;
  (function step(){
    document.querySelectorAll('#rBody .para').forEach(p=>p.classList.remove('lit'));
    if(i >= paras.length){ btn.classList.remove('playing'); return; }
    const el = document.querySelector(`#rBody [data-p="${i}"]`);
    if(el){ el.classList.add('lit'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
    const [text, ai] = paras[i]; i++;
    Voice.say(CUR, ai, text, ()=> setTimeout(step, 260));
  })();
}
document.getElementById('rSpk').onclick  = ()=>{ Voice.stop(); readFrom(0); };
document.getElementById('rBack').onclick = ()=>{ Voice.stop(); setNav('home'); renderHome(); go('home'); };
document.getElementById('rQuiz').onclick = ()=>{ Voice.stop(); openQuiz(CUR); };

/* ---------- flashcards ---------- */
let C = null;
function openCards(n){
  CUR = n; const u = unitByN(n);
  if(!u.cards.length){ openPicker('cards'); return; }
  Voice.warm(n);
  C = { list: u.cards.slice(), i: 0, flip: false };
  document.getElementById('cTitle').textContent = u.t;
  go('cards'); renderCard();
}
function renderCard(){
  const c = C.list[C.i];
  document.getElementById('cCount').textContent = `Card ${C.i+1} of ${C.list.length}`;
  document.getElementById('cBar').style.width = ((C.i+1)/C.list.length*100)+'%';
  const host = document.getElementById('cCard');
  host.innerHTML = C.flip
    ? `<div class="card"><div class="back">${c.b}</div><div class="flip">Tap to turn back</div></div>`
    : `<div class="card"><div class="face">${c.f}</div><div class="flip">Tap to see the answer</div></div>`;
  host.querySelector('.card').onclick = ()=>{ C.flip = !C.flip; renderCard(); sayCard(); };
  sayCard();
}
function sayCard(){
  const c = C.list[C.i], b = document.getElementById('cSpk');
  b.classList.add('playing');
  Voice.say(CUR, C.flip ? c.ai.b : c.ai.f, C.flip ? c.b : c.f, ()=> b.classList.remove('playing'));
}
document.getElementById('cSpk').onclick  = ()=>{ Voice.stop(); sayCard(); };
document.getElementById('cBack').onclick = ()=>{ Voice.stop(); openPicker('cards'); };
document.getElementById('cNext').onclick = ()=>{ Voice.stop(); C.flip=false; C.i=(C.i+1)%C.list.length; renderCard(); };
document.getElementById('cPrev').onclick = ()=>{ Voice.stop(); C.flip=false; C.i=(C.i-1+C.list.length)%C.list.length; renderCard(); };

/* ---------- questions ---------- */
let Q = null;
function openQuiz(n){
  CUR = n; const u = unitByN(n);
  if(!u.quiz.length){ openPicker('quiz'); return; }
  Voice.warm(n);
  Q = { list: u.quiz.slice(), i: 0, right: 0, missed: [], locked: false };
  document.getElementById('qTitle').textContent = u.t;
  go('quiz'); renderQ();
}
function renderQ(){
  const q = Q.list[Q.i];
  Q.locked = false;
  document.getElementById('qCount').textContent = `Question ${Q.i+1} of ${Q.list.length}`;
  document.getElementById('qBar').style.width = (Q.i/Q.list.length*100)+'%';
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qWhy').innerHTML = '';
  document.getElementById('qAnswer').innerHTML = `<div class="opts">` + q.o.map((o,i)=>
    `<button class="opt" data-o="${i}"><span class="num">${i+1}</span><span>${o}</span></button>`).join('') + `</div>`;
  document.querySelectorAll('[data-o]').forEach(b=> b.onclick = ()=> answer(+b.dataset.o, b));
  readQ();
}
function readQ(){
  const q = Q.list[Q.i], btn = document.getElementById('qSpk');
  btn.classList.add('playing');
  const items = [[q.ai.q, q.q, -1]].concat(q.o.map((o,i)=>[q.ai.o[i], o, i]));
  let k = 0;
  (function run(){
    document.querySelectorAll('.opt.reading').forEach(o=>o.classList.remove('reading'));
    if(k >= items.length){ btn.classList.remove('playing'); return; }
    const [ai, text, oi] = items[k++];
    if(oi >= 0){ const el = document.querySelector(`[data-o="${oi}"]`); if(el) el.classList.add('reading'); }
    Voice.say(CUR, ai, text, ()=> setTimeout(run, 200));
  })();
}
document.getElementById('qSpk').onclick  = ()=>{ Voice.stop(); readQ(); };
document.getElementById('qBack').onclick = ()=>{ Voice.stop(); openPicker('quiz'); };
function answer(i, btn){
  if(Q.locked) return;
  Q.locked = true; Voice.stop();
  const q = Q.list[Q.i], ok = (i === q.a);
  btn.classList.add(ok ? 'right' : 'wrong');
  if(!ok){ const r = document.querySelector(`[data-o="${q.a}"]`); if(r) r.classList.add('right'); }
  if(ok) Q.right++; else Q.missed.push(q);
  const lead = ok ? 'Yes.' : 'The answer is highlighted.';
  document.getElementById('qWhy').innerHTML =
    `<div class="why${ok?'':' miss'}"><b>${lead}</b> ${q.why}</div>
     <button class="btn" id="nextQ" style="margin-top:14px">${Q.i+1>=Q.list.length?'See how you did':'Next'}</button>`;
  document.getElementById('nextQ').onclick = ()=>{
    Voice.stop(); Q.i++;
    if(Q.i >= Q.list.length) endQuiz(); else renderQ();
  };
  Voice.say(CUR, q.ai.w, lead + ' ' + q.why);
}
function endQuiz(){
  const scores = db.get('scores', {});
  if(Q.right > (scores[CUR]||0)){ scores[CUR] = Q.right; db.set('scores', scores); }
  db.set('last', new Date().toISOString().slice(0,10));
  document.getElementById('dScore').textContent = Q.right + ' / ' + Q.list.length;
  document.getElementById('dMsg').textContent = Q.right === Q.list.length
    ? 'All of them. That week is yours.'
    : (Q.right >= Q.list.length/2 ? 'Good. The ones below are the ones to come back to.'
                                  : 'Worth reading the week again — it will stick the second time.');
  document.getElementById('dMissed').innerHTML = Q.missed.length
    ? `<div class="sechead">Worth another look</div>` + Q.missed.map(q=>
        `<div class="para" style="cursor:default;font-size:14.5px"><b>${q.q}</b><br>
          <span style="color:var(--dim)">${q.o[q.a]} — ${q.why}</span></div>`).join('')
    : '';
  go('done');
}
document.getElementById('dAgain').onclick = ()=> openQuiz(CUR);
document.getElementById('dHome').onclick  = ()=>{ setNav('home'); renderHome(); go('home'); };

/* ---------- boot ---------- */
fetch('balangay.json').then(r=>r.json()).then(j=>{ D = j; renderHome(); })
  .catch(()=>{ document.getElementById('says').textContent =
    "Couldn't load the curriculum file. Make sure balangay.json sits next to this page."; });
</script>
</body>
</html>
