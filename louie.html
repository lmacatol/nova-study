<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Louie — Factors &amp; Multiples</title>
<style>
:root{
  --bg:#0b1014; --panel:#121a20; --panel2:#18232b; --line:#24333d;
  --ink:#e8f1f5; --dim:#8ba3b0; --acc:#3ddc97; --acc2:#2bb37b;
  --warn:#ffc857; --bad:#ff6b6b; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 92px; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
a{color:var(--acc);text-decoration:none}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;background:rgba(11,16,20,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topin{max-width:660px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.badge{
  width:38px;height:38px;border-radius:11px;background:var(--acc);color:#06210f;
  display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.3px;flex:0 0 auto
}
.who b{display:block;font-size:15px;line-height:1.2}
.who span{display:block;font-size:12px;color:var(--dim)}
.topright{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{
  border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer
}
.pill.on{border-color:var(--acc);color:var(--acc)}

/* ---------- generic ---------- */
h1{font-size:22px;margin:22px 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:26px 0 10px;letter-spacing:-.2px}
.muted{color:var(--dim);font-size:13.5px;line-height:1.6}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0
}
.btn{
  display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;
  background:var(--acc);color:#06210f;font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.warn{background:var(--warn);color:#2a1d00}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ---------- menu tiles ---------- */
.tile{
  display:flex;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin:10px 0;cursor:pointer;color:inherit;font-family:inherit
}
.tile:active{border-color:var(--acc)}
.tico{
  width:44px;height:44px;border-radius:12px;background:var(--panel2);
  display:grid;place-items:center;font-size:21px;flex:0 0 auto
}
.tile b{display:block;font-size:15.5px}
.tile span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.tchev{margin-left:auto;color:var(--dim);font-size:19px}

/* ---------- question ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.qnum{font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.qask{font-size:20px;line-height:1.45;margin:14px 0 4px;white-space:pre-wrap}
.qask .big{font-size:27px;font-weight:700;letter-spacing:.4px;display:block;margin-top:6px}
.tag{
  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);
  border-radius:999px;padding:3px 9px
}
.tag.b{color:var(--warn);border-color:var(--warn)}
.tag.c{color:#7db9ff;border-color:#7db9ff}
.tag.d{color:#c79bff;border-color:#c79bff}
.tag.e{color:#ffb454;border-color:#ffb454}
.digrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  margin:22px 0 6px;user-select:none}
.dig{font:700 46px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);padding:0 1px}
.gap{background:none;border:0;padding:0 3px;cursor:pointer;display:flex;align-items:flex-end;
  height:54px;font-family:inherit}
.gap i{display:block;width:12px;height:12px;border-radius:50%;background:var(--panel2);
  border:1.5px dashed var(--line);transition:.15s}
.gap:active i{transform:scale(1.25)}
.gap.on i{background:var(--acc);border-color:var(--acc);border-style:solid}
.gap.bad i{background:var(--bad);border-color:var(--bad);border-style:solid}
.gap.show i{border-color:var(--acc);border-style:solid}
.digrow.done .gap{cursor:default}
.placed{text-align:center;font:700 30px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--acc);margin:6px 0 0;min-height:36px}
pre.work{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin:12px 0 0;font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);
  white-space:pre;overflow-x:auto}
.fb .why{display:block;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.14)}
.fb .why b{display:inline;font-size:14px;color:var(--warn)}
.calcq{font-size:30px;font-weight:700;letter-spacing:.5px;margin:14px 0 6px;line-height:1.35}

input[type=text],input[type=number],textarea{
  width:100%;background:var(--panel2);border:1.5px solid var(--line);color:var(--ink);
  border-radius:12px;padding:13px 14px;font-size:18px;font-family:inherit;outline:none
}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{font-size:15px;line-height:1.55;min-height:96px;resize:vertical}
label.fl{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px;font-weight:600}

.fb{border-radius:13px;padding:13px 15px;margin:12px 0;font-size:14.5px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.4)}
.fb.no{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4)}
.fb b{display:block;margin-bottom:5px;font-size:15px}
.fb .ans{color:var(--acc);font-weight:700}

/* ---------- scratchpad ---------- */
.scratch{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);
  border-top:1px solid var(--line);transform:translateY(calc(100% - 46px));
  transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)
}
.scratch.open{transform:translateY(0)}
.schandle{
  height:46px;display:flex;align-items:center;gap:9px;padding:0 16px;cursor:pointer;
  max-width:660px;margin:0 auto;font-size:13.5px;font-weight:700;color:var(--dim)
}
.scbody{max-width:660px;margin:0 auto;padding:4px 16px 18px}
.factout{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;
  margin-top:10px;font-size:15px;min-height:52px;line-height:1.7
}
.factout .pf{color:var(--acc);font-weight:700;letter-spacing:.5px}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;font-size:13px;color:var(--dim);cursor:pointer
}

/* ---------- results ---------- */
.score{text-align:center;padding:28px 0 6px}
.score .n{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1}
.score .of{font-size:17px;color:var(--dim);margin-top:4px}
.secline{
  display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14.5px
}
.secline:last-child{border-bottom:0}
.secline .s{margin-left:auto;font-weight:700}
.rev{border-left:3px solid var(--line);padding:2px 0 2px 13px;margin:14px 0}
.rev.wrong{border-color:var(--bad)}
.rev.right{border-color:var(--acc)}
.rev p{margin:0 0 5px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.rev .lbl{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--dim);text-transform:uppercase}
.hide{display:none}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="badge">Lou</div>
  <div class="who"><b>Louie</b><span id="subline">Factors &amp; Multiples</span></div>
  <div class="topright">
    <button class="pill" id="homeBtn" onclick="go('home')">Menu</button>
  </div>
</div></div>

<div class="wrap" id="app"></div>

<div class="scratch" id="scratch">
  <div class="schandle" onclick="toggleScratch()">
    <span id="scarrow">▲</span> Prime factor pad
    <span style="margin-left:auto;font-weight:500" id="scnote">tap to open</span>
  </div>
  <div class="scbody">
    <input type="number" inputmode="numeric" id="scin" placeholder="Type a number…"
           oninput="factorNow()" autocomplete="off">
    <div class="factout" id="scout">Break any number into its prime factors.</div>
    <div class="chipbar" id="scchips"></div>
  </div>
</div>

<script>
/* ============================================================
   Louie — Factors & Multiples
   Every answer in this file is COMPUTED, never typed by hand.
   ============================================================ */

/* ---------- number theory ---------- */
function gcd2(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a; }
function lcm2(a,b){ return a/gcd2(a,b)*b; }
function GCF(){ return [].slice.call(arguments).reduce(gcd2); }
function LCM(){ return [].slice.call(arguments).reduce(lcm2); }
function primeFactors(n){
  const out=[]; n=Math.abs(n|0);
  if(n<2) return out;
  for(let d=2; d*d<=n; d++){ while(n%d===0){ out.push(d); n/=d; } }
  if(n>1) out.push(n);
  return out;
}
function pfString(n){
  const f=primeFactors(n);
  return f.length ? f.join(' × ') : String(n);
}
function factorPairs(n){
  const out=[];
  for(let i=1;i*i<=n;i++) if(n%i===0) out.push([i,n/i]);
  return out;
}

/* ---------- storage (shares the Nova origin, so namespace it) ---------- */
const K='lou:';
const raw={
  get(k,d){ try{ const v=localStorage.getItem(K+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }
};
function bump(k,by){ raw.set(k,(raw.get(k,0)|0)+(by||1)); }

/* ---------- tiny click sound (no library, no files) ---------- */
let AC=null;
function tick(kind){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    const f = kind==='ok'?880 : kind==='no'?180 : 520;
    o.type = kind==='no' ? 'sawtooth' : 'sine';
    o.frequency.setValueAtTime(f,t);
    if(kind==='ok') o.frequency.exponentialRampToValueAtTime(f*1.5,t+.09);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(kind?.13:.06,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+(kind?.22:.09));
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.3);
  }catch(e){}
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randInt(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

/* ---------- the 15-question graded test (same as the printed PDF) ---------- */
const TEST = [
 {
  "sec": "A",
  "q": "12 and 18",
  "a": "36",
  "w": "12 = 2 × 2 × 3, 18 = 2 × 3 × 3. Take the highest power of each prime: LCM = 36."
 },
 {
  "sec": "A",
  "q": "8 and 20",
  "a": "40",
  "w": "8 = 2 × 2 × 2, 20 = 2 × 2 × 5. Take the highest power of each prime: LCM = 40."
 },
 {
  "sec": "A",
  "q": "6, 9, and 15",
  "a": "90",
  "w": "6 = 2 × 3; 9 = 3 × 3; 15 = 3 × 5. Highest power of each prime gives LCM = 90."
 },
 {
  "sec": "A",
  "q": "4, 10, and 14",
  "a": "140",
  "w": "4 = 2 × 2; 10 = 2 × 5; 14 = 2 × 7. Highest power of each prime gives LCM = 140."
 },
 {
  "sec": "B",
  "q": "48 and 72",
  "a": "24",
  "w": "48 = 2 × 2 × 2 × 2 × 3, 72 = 2 × 2 × 2 × 3 × 3. Multiply the primes they share: GCF = 24."
 },
 {
  "sec": "B",
  "q": "54 and 90",
  "a": "18",
  "w": "54 = 2 × 3 × 3 × 3, 90 = 2 × 3 × 3 × 5. Multiply the primes they share: GCF = 18."
 },
 {
  "sec": "B",
  "q": "24, 60, and 84",
  "a": "12",
  "w": "24 = 2 × 2 × 2 × 3; 60 = 2 × 2 × 3 × 5; 84 = 2 × 2 × 3 × 7. Shared primes across all three: GCF = 12."
 },
 {
  "sec": "B",
  "q": "45, 75, and 120",
  "a": "15",
  "w": "45 = 3 × 3 × 5; 75 = 3 × 5 × 5; 120 = 2 × 2 × 2 × 3 × 5. Shared primes across all three: GCF = 15."
 },
 {
  "sec": "C",
  "q": "Ms. Reyes has 72 pencils and 108 erasers. She wants to make identical supply kits with none left over.\n(a) What is the greatest number of kits she can make?\n(b) How many pencils and how many erasers are in one kit?",
  "a": "(a) 36 kits  (b) 2 pencils and 3 erasers",
  "w": "Nothing left over and identical kits means GCF. 72 = 2 × 2 × 2 × 3 × 3, 108 = 2 × 2 × 3 × 3 × 3, so GCF = 36. Then 72 ÷ 36 = 2 pencils and 108 ÷ 36 = 3 erasers."
 },
 {
  "sec": "C",
  "q": "Two lighthouses flash together at midnight. One flashes every 18 seconds, the other every 24 seconds.\n(a) After how many seconds do they flash together again?\n(b) How many times do they flash together in 10 minutes (not counting midnight)?",
  "a": "(a) 72 seconds  (b) 8 times",
  "w": "\"Happen together again\" means LCM. 18 = 2 × 3 × 3, 24 = 2 × 2 × 2 × 3, so LCM = 72 seconds. 10 minutes = 600 seconds, and 600 ÷ 72 = 8.33, so it happens 8 whole times."
 },
 {
  "sec": "C",
  "q": "Three buses leave the depot together at 6:00 a.m. Bus A leaves every 9 minutes, Bus B every 12 minutes, and Bus C every 15 minutes.\nAt what time do all three next leave together?",
  "a": "9:00 a.m. (180 minutes later)",
  "w": "LCM of 9, 12 and 15. 9 = 3 × 3, 12 = 2 × 2 × 3, 15 = 3 × 5, so LCM = 180 minutes = 3 hours. 6:00 a.m. + 3 hours = 9:00 a.m."
 },
 {
  "sec": "C",
  "q": "Devon has 100 red beads and 75 blue beads. He makes identical bracelets and uses every bead.\n(a) What is the greatest number of bracelets?\n(b) How many beads are on each bracelet altogether?",
  "a": "(a) 25 bracelets  (b) 7 beads",
  "w": "GCF(100, 75) = 25. Each bracelet gets 100 ÷ 25 = 4 red and 75 ÷ 25 = 3 blue, so 4+3 = 7 beads in total."
 },
 {
  "sec": "D",
  "q": "Priya draws a Venn diagram for the prime factors of 90 and 126. She puts 5 in the 90-only side, 7 in the 126-only side, and 2 and 3 in the middle. Malik says her diagram is wrong.\nWho is correct? Explain, and give the correct diagram.",
  "a": "Malik is correct — Priya is missing a second 3 in the middle.",
  "w": "90 = 2 × 3 × 3 × 5 and 126 = 2 × 3 × 3 × 7. They share 2, 3 AND 3. Priya only put one 3 in the middle, so her diagram multiplies back to 2x3x5 = 30, not 90. Correct diagram: middle = 2, 3, 3; 90-only = 5; 126-only = 7. (That also shows GCF = 18.)"
 },
 {
  "sec": "D",
  "q": "Marco says \"the LCM of two numbers is always the two numbers multiplied together.\"\n(a) Give an example where Marco is right.\n(b) Give an example where he is wrong.\n(c) Finish this sentence: Marco's rule only works when ______.",
  "a": "(a) e.g. 7 and 9 gives LCM 63, which is 7 × 9.  (b) e.g. 6 and 8 gives LCM 24, not 48.  (c) ...the two numbers share no factors except 1 (their GCF is 1)",
  "w": "When two numbers share a factor, that factor gets counted twice in the product, so the LCM is smaller. 6 = 2x3 and 8 = 2x2x2 share a 2, so LCM = 24 while 6x8 = 48. When the GCF is 1 there is nothing shared, so LCM = the product."
 },
 {
  "sec": "D",
  "q": "For 12 and 18: the GCF is 6 and the LCM is 36.\n(a) Work out GCF x LCM.\n(b) Work out 12 x 18.\n(c) Test whether the same thing happens for 8 and 20. Does the pattern hold?",
  "a": "(a) 216  (b) 216  (c) Yes — GCF(8, 20) = 4 and LCM(8, 20) = 40, and 4 × 40 = 160 = 8 × 20",
  "w": "GCF × LCM always equals the product of the two numbers. Every prime is counted once in the GCF and once in the LCM, which together is exactly how many times it appears in the product."
 }
];

/* ============================================================
   GENERATORS — endless practice. Answers are always computed.
   ============================================================ */

/* Numbers chosen so the answer is interesting: they must share a
   factor (otherwise GCF is 1 and LCM is just the product). */
function pairWithShare(minG, maxN){
  for(let tries=0; tries<400; tries++){
    const g = randInt(minG, 12);
    const a = g*randInt(2,9), b = g*randInt(2,9);
    if(a===b) continue;
    if(a>maxN || b>maxN) continue;
    if(GCF(a,b) < minG) continue;
    return [a,b];
  }
  return [12,18];
}
function tripleWithShare(maxN){
  for(let tries=0; tries<400; tries++){
    const g = randInt(2,8);
    const n = [g*randInt(2,7), g*randInt(2,7), g*randInt(2,7)];
    if(new Set(n).size<3) continue;
    if(Math.max.apply(null,n)>maxN) continue;
    if(LCM.apply(null,n) > 600) continue;
    return n;
  }
  return [6,9,15];
}

function genLCM(hard){
  const n = hard ? tripleWithShare(60) : pairWithShare(2,40);
  const ans = LCM.apply(null,n);
  return {
    sec:'A', kind:'num',
    q: listOf(n),
    ask:'Least common multiple',
    a: String(ans),
    w: n.map(x=> x+' = '+pfString(x)).join('; ') +
       '. Take the highest power of every prime that shows up: LCM = '+ans+'.'
  };
}
function genGCF(hard){
  const n = hard ? tripleWithShare(140) : pairWithShare(3,120);
  const ans = GCF.apply(null,n);
  return {
    sec:'B', kind:'num',
    q: listOf(n),
    ask:'Greatest common factor',
    a: String(ans),
    w: n.map(x=> x+' = '+pfString(x)).join('; ') +
       '. Multiply only the primes all of them share: GCF = '+ans+'.'
  };
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function listOf(n){
  if(n.length===2) return n[0]+' and '+n[1];
  return n.slice(0,-1).join(', ')+', and '+n[n.length-1];
}

/* --- word problems. Each template computes its own answer. --- */
const NAMES = ['Ms. Reyes','Mr. Okafor','Dana','Priya','Marco','Devon','Ms. Han','Jamal','Nina','Mr. Cruz'];

function wpGCF(){
  const g = randInt(6,18), x = randInt(2,7), y = randInt(2,7);
  if(x===y) return wpGCF();
  const A = g*x, B = g*y;
  if(GCF(A,B)!==g) return wpGCF();
  const who = pick(NAMES);
  const kit = pick([
    ['pencils','erasers','supply kits'],
    ['red beads','blue beads','bracelets'],
    ['granola bars','juice boxes','snack bags'],
    ['stickers','pencils','party favors']
  ]);
  return {
    sec:'C', kind:'two',
    q: who+' has '+A+' '+kit[0]+' and '+B+' '+kit[1]+'. Every '+
       kit[2].replace(/s$/,'')+' must be identical with nothing left over.',
    p1:'Greatest number of '+kit[2]+'?',
    p2:cap(kit[0])+' in each?',
    a1:String(g), a2:String(x),
    a:'(a) '+g+' '+kit[2]+'  (b) '+x+' '+kit[0]+' and '+y+' '+kit[1],
    w:'Identical groups with nothing left over means GCF. '+
      A+' = '+pfString(A)+' and '+B+' = '+pfString(B)+', so GCF = '+g+'. '+
      'Then '+A+' ÷ '+g+' = '+x+' and '+B+' ÷ '+g+' = '+y+'.'
  };
}
function wpLCM(){
  const a = randInt(4,20), b = randInt(4,20);
  if(a===b || LCM(a,b)>400) return wpLCM();
  const L = LCM(a,b);
  const kind = pick(['light','bus']);
  if(kind==='light'){
    const win = 600;
    const times = Math.floor(win/L);
    if(times<2) return wpLCM();
    return {
      sec:'C', kind:'two',
      q:'Two lighthouses flash together at midnight. One flashes every '+a+
        ' seconds, the other every '+b+' seconds.',
      p1:'Seconds until they flash together again?',
      p2:'Times together in 10 minutes (not counting midnight)?',
      a1:String(L), a2:String(times),
      a:'(a) '+L+' seconds  (b) '+times+' times',
      w:'"Together again" means LCM. '+a+' = '+pfString(a)+' and '+b+' = '+pfString(b)+
        ', so LCM = '+L+' seconds. 10 minutes = 600 seconds, and 600 ÷ '+L+
        ' = '+(600/L).toFixed(2)+', so it happens '+times+' whole times.'
    };
  }
  const hrs = L/60;
  if(L%60!==0 || hrs>6) return wpLCM();
  return {
    sec:'C', kind:'two',
    q:'Two buses leave the depot together at 6:00 a.m. Bus A leaves every '+a+
      ' minutes and Bus B every '+b+' minutes.',
    p1:'Minutes until they leave together again?',
    p2:'What hour is that? (just the number, e.g. 9)',
    a1:String(L), a2:String(6+hrs),
    a:'(a) '+L+' minutes  (b) '+(6+hrs)+':00 a.m.',
    w:'LCM of '+a+' and '+b+' is '+L+' minutes = '+hrs+' hours. 6:00 + '+hrs+
      ' hours = '+(6+hrs)+':00 a.m.'
  };
}

function genWord(){ return Math.random()<.5 ? wpGCF() : wpLCM(); }

/* --- reasoning: computed both ways, self-graded --- */
function genReason(){
  const t = randInt(0,2);
  if(t===0){
    const a=pick([90,84,126,120,150]), b=pick([126,140,180,210,198]);
    if(a===b) return genReason();
    const fa=primeFactors(a), fb=primeFactors(b);
    const shared=[]; const cb=fb.slice();
    fa.forEach(p=>{ const i=cb.indexOf(p); if(i>-1){ shared.push(p); cb.splice(i,1); } });
    return {
      sec:'D', kind:'open',
      q:'Draw the Venn diagram of the prime factors of '+a+' and '+b+
        '.\nWhat goes in the middle, and what does that tell you about the GCF?',
      a:'Middle: '+(shared.join(', ')||'nothing shared')+
        '. Multiplying the middle gives GCF = '+GCF(a,b)+'.',
      w:a+' = '+pfString(a)+' and '+b+' = '+pfString(b)+
        '. Watch for repeated primes — if a prime appears twice in BOTH numbers, '+
        'it goes in the middle twice. The middle multiplied together is always the GCF.'
    };
  }
  if(t===1){
    const [a,b]=pairWithShare(2,30);
    return {
      sec:'D', kind:'open',
      q:'Is the LCM of '+a+' and '+b+' the same as '+a+' × '+b+'?\n'+
        'Explain why or why not.',
      a:'No. LCM = '+LCM(a,b)+' but '+a+' × '+b+' = '+(a*b)+'.',
      w:'They share a factor of '+GCF(a,b)+'. Multiplying counts that shared factor twice, '+
        'so the product overshoots. The rule LCM = product only works when the GCF is 1.'
    };
  }
  const [a,b]=pairWithShare(2,30);
  return {
    sec:'D', kind:'open',
    q:'For '+a+' and '+b+': work out GCF × LCM, then work out '+a+' × '+b+
      '.\nWhat do you notice?',
    a:'GCF × LCM = '+GCF(a,b)+' × '+LCM(a,b)+' = '+(GCF(a,b)*LCM(a,b))+
      ', and '+a+' × '+b+' = '+(a*b)+'. They match.',
    w:'GCF × LCM always equals the product of the two numbers. Every prime gets counted '+
      'once in the GCF and once in the LCM, which together is exactly how often it appears in the product.'
  };
}

function buildPractice(mode, n){
  const out=[];
  for(let i=0;i<n;i++){
    if(mode==='lcm')       out.push(genLCM(i>=Math.floor(n/2)));
    else if(mode==='gcf')  out.push(genGCF(i>=Math.floor(n/2)));
    else if(mode==='word') out.push(genWord());
    else {
      const r=i%4;
      out.push(r===0?genLCM(i>n/2):r===1?genGCF(i>n/2):r===2?genWord():genReason());
    }
  }
  return out;
}

/* ============================================================
   DECIMALS
   All arithmetic here is done on INTEGERS with a separate scale
   (number of decimal places). Nothing is ever computed in
   floating point, because 0.1 + 0.2 = 0.30000000000000004 and a
   kid should never be marked wrong for a bug of mine.
   ============================================================ */
function pow10(n){ return Math.round(Math.pow(10, n)); }

/* integer value scaled by 10^s  ->  display string with exactly s places */
function show(v, s){
  const neg = v < 0; v = Math.abs(v);
  let t = String(v);
  if(s > 0){
    t = t.padStart(s+1, '0');
    t = t.slice(0, t.length-s) + '.' + t.slice(t.length-s);
  }
  return (neg?'-':'') + t;
}
/* same, but trimmed — the form we store as the answer */
function trim(v, s){
  let t = show(v, s);
  if(t.indexOf('.') > -1) t = t.replace(/0+$/,'').replace(/\.$/,'');
  return t;
}
/* canonical form of anything the student types, for comparison */
function normNum(str){
  let s = String(str==null?'':str).trim().replace(/[$,\s]/g,'');
  if(s === '') return null;
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  let neg = s[0] === '-'; if(neg) s = s.slice(1);
  let i = s.split('.')[0] || '0', f = s.split('.')[1] || '';
  i = i.replace(/^0+/,'') || '0';
  f = f.replace(/0+$/,'');
  const body = i + (f ? '.'+f : '');
  return (neg && body !== '0' ? '-' : '') + body;
}
function sameNum(a, b){
  const x = normNum(a); return x !== null && x === normNum(b);
}

/* a decimal with `s` places and a whole part up to maxWhole */
function mkDec(maxWhole, s){
  const whole = randInt(0, maxWhole);
  let frac = randInt(0, pow10(s)-1);
  /* no trailing zero in the decimal part: real problems say 11.6, not 11.60 */
  if(s > 0 && frac % 10 === 0) frac += randInt(1, 9);
  if(s > 0 && frac >= pow10(s)) frac = pow10(s) - 1;
  const v = whole*pow10(s) + frac;
  return v === 0 ? mkDec(maxWhole, s) : { v, s };
}
const DECSEC = 'E';

function alignNote(A, B, m){
  if(A.s === B.s) return 'Both numbers already have ' + A.s + ' decimal place' + (A.s===1?'':'s') + ', so they line up as written.';
  const short = A.s < B.s ? A : B;
  return 'They have different numbers of decimal places. Write ' + show(short.v, short.s) +
         ' as ' + show(short.v*pow10(m-short.s), m) + ' so the points line up, then work down the columns.';
}

function genDecAdd(hard){
  const sa = hard ? randInt(1,3) : randInt(1,2);
  const sb = hard ? randInt(1,3) : sa;
  const A = mkDec(hard?499:99, sa), B = mkDec(hard?499:99, sb);
  const m = Math.max(sa, sb);
  const sum = A.v*pow10(m-sa) + B.v*pow10(m-sb);
  return {
    sec:DECSEC, kind:'calc', ask:'Add',
    q: show(A.v,sa) + ' + ' + show(B.v,sb),
    a: trim(sum, m),
    w: alignNote(A, B, m) + ' The decimal point in the answer drops straight down: ' + trim(sum,m) + '.'
  };
}
function genDecSub(hard){
  let sa = hard ? randInt(0,3) : randInt(1,2);
  let sb = hard ? randInt(1,3) : sa;
  if(sa === 0 && sb === 0) sb = 2;
  let A = mkDec(hard?499:99, sa), B = mkDec(hard?499:99, sb);
  const m = Math.max(sa, sb);
  let av = A.v*pow10(m-sa), bv = B.v*pow10(m-sb);
  if(av < bv){ const t=A; A=B; B=t; const t2=av; av=bv; bv=t2; }
  if(av === bv) return genDecSub(hard);
  const diff = av - bv;
  const wholeNote = A.s === 0
    ? 'Watch this one — ' + show(A.v,0) + ' is a whole number, so write it as ' + show(av, m) + ' before you subtract. '
    : '';
  return {
    sec:DECSEC, kind:'calc', ask:'Subtract',
    q: show(A.v,A.s) + ' − ' + show(B.v,B.s),
    a: trim(diff, m),
    w: wholeNote + alignNote(A, B, m) + ' Answer: ' + trim(diff, m) + '.'
  };
}
function genDecMul(hard){
  /* every so often, a pure place-value shift — the rule worth owning */
  if(!hard && Math.random() < 0.25){
    const s = randInt(1,2), A = mkDec(99, s), k = pick([1,2,3]);
    const prod = A.v * pow10(k);
    return {
      sec:DECSEC, kind:'calc', ask:'Multiply',
      q: show(A.v,s) + ' × ' + pow10(k),
      a: trim(prod, s),
      w: 'Multiplying by ' + pow10(k) + ' moves the decimal point ' + k +
         ' place' + (k===1?'':'s') + ' to the RIGHT. ' + show(A.v,s) + ' → ' + trim(prod,s) + '.'
    };
  }
  const sa = randInt(1,2), sb = hard ? randInt(1,2) : 1;
  const A = mkDec(hard?99:19, sa), B = mkDec(hard?19:9, sb);
  const prod = A.v * B.v, m = sa + sb;
  return {
    sec:DECSEC, kind:'calc', ask:'Multiply',
    q: show(A.v,sa) + ' × ' + show(B.v,sb),
    a: trim(prod, m),
    w: 'Ignore the points and multiply whole numbers: ' + A.v + ' × ' + B.v + ' = ' + prod +
       '. Now count decimal places in the question — ' + sa + ' and ' + sb + ', so ' + m +
       ' altogether. Put the point ' + m + ' places from the right: ' + trim(prod, m) + '.'
  };
}
function genDecDiv(hard){
  /* place-value shift the other way */
  if(!hard && Math.random() < 0.25){
    const s = randInt(0,1), A = mkDec(999, s), k = pick([1,2,3]);
    return {
      sec:DECSEC, kind:'calc', ask:'Divide',
      q: show(A.v,s) + ' ÷ ' + pow10(k),
      a: trim(A.v, s+k),
      w: 'Dividing by ' + pow10(k) + ' moves the decimal point ' + k +
         ' place' + (k===1?'':'s') + ' to the LEFT. ' + show(A.v,s) + ' → ' + trim(A.v, s+k) + '.'
    };
  }
  if(!hard){
    /* decimal ÷ whole number — build it from the answer so it comes out even */
    const divisor = randInt(2, 12);
    const qs = randInt(1, 2);
    const quot = mkDec(29, qs);
    const dividend = quot.v * divisor;
    return {
      sec:DECSEC, kind:'calc', ask:'Divide',
      q: trim(dividend, qs) + ' ÷ ' + divisor,
      a: trim(quot.v, qs),
      w: 'Dividing by a whole number: the decimal point in the answer sits directly above the one in ' +
         trim(dividend, qs) + '. ' + trim(dividend,qs) + ' ÷ ' + divisor + ' = ' + trim(quot.v,qs) +
         '. Check it: ' + trim(quot.v,qs) + ' × ' + divisor + ' = ' + trim(dividend,qs) + '.'
    };
  }
  /* decimal ÷ decimal — the one that needs the divisor made whole */
  const ds = randInt(1,2);
  const D = mkDec(9, ds);
  if(D.v === 0) return genDecDiv(hard);
  const qs = randInt(0,1);
  const Qn = mkDec(19, qs);
  const dividend = Qn.v * D.v;            // scale = qs + ds
  return {
    sec:DECSEC, kind:'calc', ask:'Divide',
    q: trim(dividend, qs+ds) + ' ÷ ' + show(D.v, ds),
    a: trim(Qn.v, qs),
    w: 'Make the divisor a whole number. Move the point ' + ds + ' place' + (ds===1?'':'s') +
       ' right in BOTH numbers: ' + show(D.v,ds) + ' becomes ' + D.v + ', and ' +
       trim(dividend, qs+ds) + ' becomes ' + trim(dividend, qs) + '. Now divide: ' +
       trim(dividend,qs) + ' ÷ ' + D.v + ' = ' + trim(Qn.v,qs) + '.'
  };
}

/* --- money and measurement word problems, answers computed the same way --- */
function money(v){ return '$' + show(v, 2); }
function genDecWord(){
  const kind = randInt(0,3);
  const who = pick(NAMES);
  if(kind === 0){
    const price = mkDec(24, 2), n = randInt(3, 8);
    const total = price.v * n;
    const paid = Math.ceil(total/1000)*1000;             // next whole $10
    return {
      sec:DECSEC, kind:'two',
      q: who + ' buys ' + n + ' notebooks at ' + money(price.v) + ' each and pays with ' + money(paid) + '.',
      p1:'Total cost? (just the number)',
      p2:'Change? (just the number)',
      a1: trim(total,2), a2: trim(paid-total,2),
      a: '(a) ' + money(total) + '  (b) ' + money(paid-total),
      w: n + ' × ' + money(price.v) + ' = ' + money(total) + '. Then ' + money(paid) +
         ' − ' + money(total) + ' = ' + money(paid-total) + '.'
    };
  }
  if(kind === 1){
    const each = mkDec(9, 2), n = randInt(3, 9);
    const total = each.v * n;
    return {
      sec:DECSEC, kind:'two',
      q: who + ' cuts a ribbon into ' + n + ' equal pieces, each ' + show(each.v,2) + ' meters long.',
      p1:'Total length in meters?',
      p2:'How many centimeters is one piece? (1 m = 100 cm)',
      a1: trim(total,2), a2: trim(each.v, 0),
      a: '(a) ' + trim(total,2) + ' m  (b) ' + trim(each.v,0) + ' cm',
      w: n + ' × ' + show(each.v,2) + ' = ' + trim(total,2) + ' m. To convert metres to centimetres multiply by 100, which moves the point two places right: ' +
         show(each.v,2) + ' m = ' + trim(each.v,0) + ' cm.'
    };
  }
  if(kind === 2){
    const per = mkDec(5, 2); if(per.v === 0) return genDecWord();
    const n = randInt(4, 9);
    const total = per.v * n;
    return {
      sec:DECSEC, kind:'two',
      q: who + ' spends ' + money(total) + ' on ' + n + ' identical drinks.',
      p1:'Cost of one drink? (just the number)',
      p2:'Cost of 3 drinks? (just the number)',
      a1: trim(per.v,2), a2: trim(per.v*3,2),
      a: '(a) ' + money(per.v) + '  (b) ' + money(per.v*3),
      w: money(total) + ' ÷ ' + n + ' = ' + money(per.v) + '. Then 3 × ' +
         money(per.v) + ' = ' + money(per.v*3) + '.'
    };
  }
  const start = mkDec(199, 2), spend1 = mkDec(49, 2), spend2 = mkDec(29, 2);
  const left = start.v - spend1.v - spend2.v;
  if(left <= 0) return genDecWord();
  return {
    sec:DECSEC, kind:'two',
    q: who + ' starts with ' + money(start.v) + ', spends ' + money(spend1.v) + ', then spends ' + money(spend2.v) + '.',
    p1:'Total spent? (just the number)',
    p2:'Amount left? (just the number)',
    a1: trim(spend1.v+spend2.v,2), a2: trim(left,2),
    a: '(a) ' + money(spend1.v+spend2.v) + '  (b) ' + money(left),
    w: money(spend1.v) + ' + ' + money(spend2.v) + ' = ' + money(spend1.v+spend2.v) +
       '. Then ' + money(start.v) + ' − ' + money(spend1.v+spend2.v) + ' = ' + money(left) + '.'
  };
}

function buildDecimals(mode, n){
  const out = [];
  for(let i=0;i<n;i++){
    const hard = i >= Math.floor(n/2);
    if(mode==='decadd')      out.push(Math.random()<0.5 ? genDecAdd(hard) : genDecSub(hard));
    else if(mode==='decmul') out.push(genDecMul(hard));
    else if(mode==='decdiv') out.push(genDecDiv(hard));
    else if(mode==='decword')out.push(genDecWord());
    else {
      const r = i % 5;
      out.push(r===0?genDecAdd(hard):r===1?genDecSub(hard):r===2?genDecMul(hard)
              :r===3?genDecDiv(hard):genDecWord());
    }
  }
  return out;
}

/* ---- the two traps Louie actually fell into on Quiz 3-3 ---- */
function genTrapMore(){
  const who = pick(NAMES), other = pick(NAMES.filter(n=>n!==who));
  const base = mkDec(99, 1);                    // e.g. 84.6
  const f = { v: randInt(15, 85), s: 2 };       // e.g. 0.55
  const second = base.v * f.v;                  // scale 3
  const diff = base.v*pow10(2) - second;        // scale 3
  return {
    sec:DECSEC, kind:'two',
    q: who + ' ran ' + show(base.v,1) + ' miles in June. In July ' + who +
       ' ran ' + show(f.v,2) + ' times that distance.',
    p1:'Miles in July?',
    p2:'How many MORE miles in June than July?',
    a1: trim(second,3), a2: trim(diff,3),
    a: '(a) ' + trim(second,3) + ' miles  (b) ' + trim(diff,3) + ' miles',
    w: 'July: ' + show(base.v,1) + ' × ' + show(f.v,2) + ' = ' + trim(second,3) +
       ' miles. But "how many MORE" asks for the difference, not July’s total: ' +
       show(base.v,1) + ' − ' + trim(second,3) + ' = ' + trim(diff,3) +
       '. Finishing the multiplication is only half the job — read the last line again before you write the answer.'
  };
}
function genTrapPieces(){
  const who = pick(NAMES);
  const piece = mkDec(4, 1); if(piece.v === 0) return genTrapPieces();
  const whole = randInt(12, 45);
  const left = randInt(1, piece.v - 1);
  const total = whole*piece.v + left;           // scale 1, deliberately not exact
  return {
    sec:DECSEC, kind:'two',
    q: who + ' has ' + show(total,1) + ' meters of wire and cuts it into pieces ' +
       show(piece.v,1) + ' meters long.',
    p1:'What does the division give you? (exact)',
    p2:'How many WHOLE pieces can be cut?',
    a1: (function(){ const r = total/piece.v; return String(Math.round(r*1000)/1000); })(),
    a2: String(whole),
    w: show(total,1) + ' ÷ ' + show(piece.v,1) + ' = ' +
       (Math.round(total/piece.v*1000)/1000) + '. You cannot cut a part-piece, so the answer is ' +
       whole + ' whole pieces — and the units are pieces, not meters. Round DOWN on a "how many fit" question, always.'
  };
}
function genCentRound(){
  const who = pick(NAMES);
  const lb = mkDec(9, 1); if(lb.v === 0) return genCentRound();
  const price = mkDec(19, 2); if(price.v === 0) return genCentRound();
  const exact = lb.v * price.v;                 // scale 3
  const cents = Math.round(exact/10);           // nearest cent, half up
  return {
    sec:DECSEC, kind:'calc', ask:'Round to the nearest cent',
    q: show(lb.v,1) + ' lb of coffee at ' + money(price.v) + ' per pound',
    a: trim(cents, 2),
    w: show(lb.v,1) + ' × ' + show(price.v,2) + ' = ' + show(exact,3) +
       '. The nearest cent means two decimal places, so look at the third digit (' +
       show(exact,3).slice(-1) + ') and round: ' + money(cents) + '.'
  };
}

/* ---- a retake of Quiz 3-3: 10 computations, then 5 applications ---- */
function buildQuiz33(){
  const calc = [
    genDecAdd(true), genDecSub(true),
    genDecMul(true), genDecMul(false),
    genDecMul(true), genDecDiv(false),
    genDecDiv(true), genDecDiv(true),
    genDecDiv(true), genDecDiv(false)
  ];
  const word = [ genDecWord(), genCentRound(), genDecWord(), genTrapMore(), genTrapPieces() ];
  return calc.concat(word);
}

/* ============================================================
   DIAGNOSIS — work out WHICH mistake he made, not just that he
   made one. Each candidate below is a real error reproduced
   exactly, then compared against what he actually typed.
   ============================================================ */
function parseShown(str){
  const s = String(str).trim();
  const i = s.split('.')[0] || '0', f = s.split('.')[1] || '';
  return { v: parseInt((i+f).replace(/^0+(?=\d)/,''), 10), s: f.length };
}
function digitsOf(str){
  const n = normNum(str);
  return n === null ? null : n.replace(/[.\-]/g,'').replace(/^0+/,'').replace(/0+$/,'') || '0';
}
function divExact(nv, ns, dv, ds){
  if(dv === 0) return null;
  let N = nv * pow10(ds), D = dv * pow10(ns);
  for(let e=0; e<=10; e++){
    const NN = N * pow10(e);
    if(NN % D === 0) return trim(NN/D, e);
  }
  return null;
}

/* returns a sentence naming the mistake, or '' if we can't tell */
function diagnoseCalc(q, given){
  const g = normNum(given);
  if(g === null) return '';
  const m = q.q.match(/^([\d.]+)\s*([+−×÷])\s*([\d.]+)$/);
  if(!m) return '';
  const A = parseShown(m[1]), B = parseShown(m[3]), op = m[2];
  const right = normNum(q.a);
  if(g === right) return '';                 // he was correct; never invent a mistake
  /* a candidate mistake only counts if it is genuinely DIFFERENT from the right
     answer — otherwise e.g. "right-aligned" fires on every same-scale sum */
  const hit = cand => cand !== null && normNum(cand) === g && normNum(cand) !== right;

  /* the big one: correct digits, point in the wrong place */
  const dg = digitsOf(given), da = digitsOf(q.a);
  const samedigits = dg && da && dg === da && g !== normNum(q.a);

  if(op === '+' || op === '−'){
    const sc = Math.max(A.s, B.s);
    const av = A.v*pow10(sc-A.s), bv = B.v*pow10(sc-B.s);
    /* right-aligned instead of point-aligned */
    if(hit(trim(op==='+' ? A.v+B.v : Math.abs(A.v-B.v), sc)))
      return 'That is what you get when you line up the right-hand ENDS of the numbers instead of the decimal points. ' +
             m[1] + ' and ' + m[3] + ' have different numbers of decimal places, so their last digits are not in the same column. Stack them by the point and fill the short one with zeros.';
    if(op==='−' && hit(trim(bv-av, sc)))
      return 'You subtracted the wrong way round. ' + m[1] + ' is on top, so it is ' + m[1] + ' − ' + m[3] + ', not the other way.';
    if(op==='−' && A.s===0)
      { if(hit(trim(av - B.v, sc))) return 'You treated ' + m[1] + ' as if it had no decimal part. It does — write it as ' + show(av, sc) + ' first, then subtract.'; }
    if(samedigits)
      return 'Your digits are right — ' + dg + ' — but the decimal point landed in the wrong place. In adding and subtracting, the point in the answer goes straight down below the points above it.';
  }

  if(op === '×'){
    if(hit(trim(A.v*B.v, A.s)) || hit(trim(A.v*B.v, B.s)))
      return 'You multiplied correctly but only counted ONE number’s decimal places. Count them in both: ' +
             m[1] + ' has ' + A.s + ', ' + m[3] + ' has ' + B.s + ', so the answer needs ' + (A.s+B.s) + '.';
    if(hit(trim(A.v*B.v, 0)))
      return 'You multiplied the digits correctly and then left the decimal point out altogether. ' +
             A.v + ' × ' + B.v + ' = ' + (A.v*B.v) + ', and now you step ' + (A.s+B.s) + ' places in from the right.';
    const sc = Math.max(A.s,B.s);
    if(hit(trim(A.v*pow10(sc-A.s) + B.v*pow10(sc-B.s), sc)))
      return 'That is the two numbers ADDED, not multiplied. Check the sign in the middle — it is ×.';
    if(samedigits)
      return 'Your multiplication is right — the digits ' + dg + ' are correct. Only the decimal point is misplaced. Count the places in the QUESTION (' + A.s + ' + ' + B.s + ' = ' + (A.s+B.s) + ') and step in that far from the right.';
  }

  if(op === '÷'){
    if(hit(divExact(B.v, B.s, A.v, A.s)))
      return 'You divided the wrong way round. ' + m[1] + ' ÷ ' + m[3] + ' means ' + m[1] +
             ' goes inside the box and ' + m[3] + ' outside. Division is not like multiplication — the order matters.';
    if(B.s > 0){
      const onlyDivisor = divExact(A.v, A.s, B.v, 0);
      if(hit(onlyDivisor))
        return 'You made the divisor whole (' + m[3] + ' → ' + B.v + ') but forgot to move the point in ' +
               m[1] + ' as well. Both numbers move the SAME number of places, or the answer comes out ' +
               pow10(B.s) + ' times off.';
    }
    if(hit(trim(A.v*B.v, A.s+B.s)))
      return 'That is the two numbers MULTIPLIED. The sign is ÷ — you are sharing ' + m[1] + ' into groups of ' + m[3] + '.';
    if(samedigits)
      return 'Your digits are right — ' + dg + ' — but the point is in the wrong place. That almost always means one number got moved and the other did not.';
    const ansV = parseShown(q.a);
    if(ansV.s > 0 && g === normNum(trim(Math.round(ansV.v/pow10(ansV.s))*pow10(ansV.s), ansV.s)))
      return 'You stopped at a whole number. It does not divide evenly, so keep going past the decimal point — add zeros to the dividend and carry on until it ends.';
  }
  if(samedigits)
    return 'The digits are right, the decimal point is not.';
  return '';
}

function diagnoseTwo(q, v1, v2){
  const bits = [];
  if(!sameNum(v1, q.a1) && sameNum(v1, q.a2))
    bits.push('You put the second answer in box (a).');
  if(!sameNum(v2, q.a2) && sameNum(v2, q.a1))
    bits.push('Box (b) has the answer to part (a) in it. You did the first piece of work correctly and then stopped — re-read what (b) is actually asking for.');
  return bits.join(' ');
}

/* the one sentence he sees when he gets it wrong */
function whyWrong(q, given, v1, v2){
  let d = '';
  if(q.kind === 'calc' || q.kind === 'num') d = diagnoseCalc(q, given);
  else if(q.kind === 'two') d = diagnoseTwo(q, v1, v2);
  return d;
}

/* ============================================================
   WHERE DOES THE POINT GO?
   The digits are already done for him. The ONLY decision is
   where the point lands. Everything else is stripped away.
   ============================================================ */
function digitsOnly(v){ return String(v); }

/* Rounding 0.66 to 1 makes a useless estimate, and rounding 0.23 to 0 makes a
   misleading one. When a factor is under 1, say what it DOES instead. */
function estMul(A, B){
  const a = A.v/pow10(A.s), b = B.v/pow10(B.s);
  const ra = Math.round(a), rb = Math.round(b);
  if(a < 1 || b < 1){
    const small = a < 1 ? show(A.v,A.s) : show(B.v,B.s);
    const other = a < 1 ? show(B.v,B.s) : show(A.v,A.s);
    return small + ' is less than 1, so the answer must come out SMALLER than ' + other +
           '. If yours is bigger, the point is too far right.';
  }
  return 'About ' + ra + ' \u00d7 ' + rb + ' = about ' + (ra*rb) + '. Your answer should land near that.';
}
function estDiv(val, divisor){
  const r = Math.round(val/divisor);
  if(r < 1) return 'Sharing about ' + Math.round(val) + ' into ' + divisor +
    ' groups gives less than 1, so the answer starts with a zero before the point.';
  return 'About ' + Math.round(val) + ' \u00f7 ' + divisor + ' = about ' + r +
         '. Your answer should land near that.';
}

/* slot k = how many digits end up to the RIGHT of the point */
function genPoint(hard){
  const mode = pick(['mul','mul','div','pow']);

  if(mode === 'mul'){
    const sa = randInt(1,2), sb = hard ? randInt(1,2) : 1;
    const A = mkDec(hard?99:19, sa), B = mkDec(9, sb);
    const prod = A.v * B.v, k = sa + sb, d = digitsOnly(prod);
    if(!(k >= 1 && k <= d.length-1)) return genPoint(hard);
    return {
      sec:DECSEC, kind:'point',
      expr: show(A.v,sa) + ' × ' + show(B.v,sb),
      lead: 'You already multiplied ' + A.v + ' × ' + B.v + ' and got',
      digits: d, k,
      rule: show(A.v,sa) + ' has ' + sa + ' place' + (sa===1?'':'s') + ' and ' +
            show(B.v,sb) + ' has ' + sb + '. ' + sa + ' + ' + sb + ' = ' + k +
            ', so count ' + k + ' place' + (k===1?'':'s') + ' in from the RIGHT.',
      est: estMul(A, B)
    };
  }

  if(mode === 'div'){
    const divisor = randInt(2,12), qs = randInt(1,2);
    const quot = mkDec(hard?99:29, qs);
    const dividend = quot.v * divisor, d = digitsOnly(quot.v);
    if(!(qs >= 1 && qs <= d.length-1)) return genPoint(hard);
    return {
      sec:DECSEC, kind:'point',
      expr: trim(dividend, qs) + ' ÷ ' + divisor,
      lead: 'You already divided and got the digits',
      digits: d, k: qs,
      rule: 'Dividing by a whole number does not move anything. The point in the answer sits directly above the point in ' +
            trim(dividend, qs) + ', which puts it ' + qs + ' place' + (qs===1?'':'s') + ' from the right.',
      est: estDiv(dividend/pow10(qs), divisor)
    };
  }

  /* multiplying or dividing by 10 / 100 / 1000 — pure point-shifting */
  const s = randInt(2,3), A = mkDec(99, s), k10 = pick([1,2]);
  const up = Math.random() < 0.5;
  const k = up ? s - k10 : s + k10;
  const d = digitsOnly(A.v);
  if(!(k >= 1 && k <= d.length-1)) return genPoint(hard);
  return {
    sec:DECSEC, kind:'point',
    expr: show(A.v,s) + (up ? ' × ' : ' ÷ ') + pow10(k10),
    lead: 'The digits do not change at all. They are still',
    digits: d, k,
    rule: (up ? 'Multiplying' : 'Dividing') + ' by ' + pow10(k10) + ' moves the point ' +
          k10 + ' place' + (k10===1?'':'s') + ' to the ' + (up?'RIGHT':'LEFT') + '. ' +
          'It started ' + s + ' from the right, so it ends up ' + k + ' from the right.',
    est: (up ? 'Multiplying makes it bigger.' : 'Dividing makes it smaller.') +
         ' If your answer went the other way, you moved the point the wrong direction.'
  };
}

function buildPoints(n){
  const out=[];
  for(let i=0;i<n;i++) out.push(genPoint(i >= Math.floor(n/2)));
  return out;
}

/* render the digit string with a tappable gap between every pair */
function pointHTML(q){
  const d = q.digits;
  let html = '<div class="digrow">';
  for(let i=0;i<d.length;i++){
    html += '<span class="dig">'+d[i]+'</span>';
    const k = d.length - 1 - i;             // digits remaining to the right
    if(k >= 1) html += '<button class="gap" data-k="'+k+'" onclick="pickPoint('+k+')"><i></i></button>';
  }
  return html + '</div>';
}
function answerWithPoint(q, k){
  const d = q.digits;
  return d.slice(0, d.length-k) + '.' + d.slice(d.length-k);
}

    <p class="muted" style="font-size:12px;text-align:center;margin:18px 0 6px">
      Stuck on a factorization? The pad at the bottom breaks any number apart for you —
      except during the test.
    </p>`;
  const chips = $('lessonChips');
  if(chips){
    chips.innerHTML = Object.keys(LESSONS).map(id=>
      `<button class="chip${lessonSeen(id)?' on':''}" onclick="openLesson('${id}')">
         ${lessonSeen(id)?'\u2713 ':''}${esc(LESSONS[id].title)}</button>`).join('');
  }
}

/* ---------- start a run ---------- */
function start(mode, skipLesson){
  const lid = LESSON_FOR[mode];
  if(lid && !skipLesson && !lessonSeen(lid)) return openLesson(lid, mode);
  tick();
  const isTest = mode==='test' || mode==='quiz33';
  S = {
    mode, isTest,
    instant: !isTest,
    list: mode==='quiz33' ? buildQuiz33()
        : mode==='test' ? normTest()
        : mode==='point'  ? buildPoints(12)
        : mode==='decadd' ? buildDecimals('decadd',10)
        : mode==='decmul' ? buildDecimals('decmul',10)
        : mode==='decdiv' ? buildDecimals('decdiv',10)
        : mode==='decword'? buildDecimals('decword',8)
        : mode==='decmix' ? buildDecimals('decmix',12)
        : mode==='word' ? buildPractice('word',8)
        : mode==='mixed'? buildPractice('mixed',12)
        : buildPractice(mode,10),
    i:0, right:0, auto:0, log:[], answered:false
  };
  $('homeBtn').style.display='';
  $('subline').textContent =
       mode==='test'   ? 'Test — 15 questions'
     : mode==='quiz33' ? 'Quiz 3-3 retake'
     : mode==='point'  ? 'Where does the point go?'
     : mode==='decadd' ? 'Adding & subtracting'
     : mode==='decmul' ? 'Multiplying'
     : mode==='decdiv' ? 'Dividing'
     : mode==='decword'? 'Decimal word problems'
     : mode==='decmix' ? 'All four operations'
     : mode==='lcm' ? 'LCM drill' : mode==='gcf' ? 'GCF drill'
     : mode==='word' ? 'Word problems' : 'Mixed round';
  setScratch(!isTest);
  go('run');
}

/* ---------- one question ---------- */
function renderQ(){
  const q = S.list[S.i], n = S.list.length;
  S.answered = false;
  const pct = Math.round(S.i/n*100);
  let body = '';

  if(q.kind==='point'){
    body = `
      <p class="muted" style="margin:14px 0 0;font-size:13px">${esc(q.expr)}</p>
      <p class="qask" style="font-size:17px;margin:8px 0 0">${esc(q.lead)}</p>
      ${pointHTML(q)}
      <p class="placed" id="placed"></p>
      <p class="muted" style="text-align:center;font-size:13px;margin-top:10px">
        Tap where the decimal point belongs.</p>`;
  } else if(q.kind==='calc'){
    body = `
      <p class="muted" style="margin:14px 0 0;font-size:13px">${esc(q.ask)}</p>
      <p class="calcq">${esc(q.q)}</p>
      <label class="fl">Your answer</label>
      <input type="text" inputmode="decimal" id="in1" autocomplete="off"
             onkeydown="if(event.key==='Enter')check()">`;
  } else if(q.kind==='num'){
    body = `
      <p class="qask">${esc(q.ask)} of<span class="big">${esc(q.q)}</span></p>
      <label class="fl">Your answer</label>
      <input type="number" inputmode="numeric" id="in1" autocomplete="off"
             onkeydown="if(event.key==='Enter')check()">`;
  } else if(q.kind==='two'){
    body = `
      <p class="qask">${esc(q.q)}</p>
      <label class="fl">a) ${esc(q.p1)}</label>
      <input type="number" inputmode="numeric" id="in1" autocomplete="off">
      <label class="fl">b) ${esc(q.p2)}</label>
      <input type="number" inputmode="numeric" id="in2" autocomplete="off"
             onkeydown="if(event.key==='Enter')check()">`;
  } else {
    body = `
      <p class="qask">${esc(q.q)}</p>
      <label class="fl">Write it out — full sentences</label>
      <textarea id="in1" placeholder="Explain your reasoning…"></textarea>`;
  }

  $('app').innerHTML = `
    <div class="qtop">
      <span class="tag ${q.sec.toLowerCase()}">${SECNAME[q.sec]}</span>
      <span class="qnum" style="margin-left:auto">${S.i+1} / ${n}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${body}
    <div class="fb" id="fb"></div>
    <div id="acts" style="margin-top:16px">
      <button class="btn" onclick="check()">${q.kind==='open'?'Show the answer':'Check'}</button>
    </div>`;
  const f=$('in1'); if(f) f.focus();
}

function pickPoint(k){
  if(S.answered) return;
  const q = S.list[S.i];
  const ok = k === q.k;
  S.answered = true;
  const given = answerWithPoint(q, k);
  S.log.push({ q, given, ok, why: ok ? '' : pointWhy(q, k) });
  if(ok){ S.right++; S.auto++; tick('ok'); buzz(18); }
  else  { S.auto++; tick('no'); buzz([22,50,22]); }

  document.querySelectorAll('.digrow').forEach(r=>r.classList.add('done'));
  document.querySelectorAll('.gap').forEach(g=>{
    const gk = +g.dataset.k;
    if(gk === q.k) g.classList.add(ok ? 'on' : 'show');
    else if(gk === k) g.classList.add('bad');
  });
  $('placed').textContent = ok ? given : given + '   \u2192   ' + answerWithPoint(q, q.k);

  const fb = $('fb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = (ok ? '<b>Right where it goes.</b>' : '<b>The point goes here: ' + esc(answerWithPoint(q, q.k)) + '</b>')
    + esc(q.rule)
    + (ok ? '' : '<span class="why"><b>Why yours was off:</b> ' + esc(pointWhy(q, k)) + '</span>')
    + '<span class="why"><b>Sense check:</b> ' + esc(q.est) + '</span>';
  const last = S.i === S.list.length-1;
  $('acts').innerHTML = `<button class="btn" onclick="next()">${last?'See results':'Next'}</button>`;
}
function pointWhy(q, k){
  const off = k - q.k;
  const times = pow10(Math.abs(off));
  return 'You put it ' + Math.abs(off) + ' place' + (Math.abs(off)===1?'':'s') + ' too far ' +
         (off > 0 ? 'LEFT, which makes the answer ' + times + ' times too small.'
                  : 'RIGHT, which makes the answer ' + times + ' times too big.');
}

function check(){
  if(S.answered) return;
  const q = S.list[S.i];
  let ok=null, given='';

  if(q.kind==='num' || q.kind==='calc'){
    given = ($('in1').value||'').trim();
    if(given==='') return;
    ok = sameNum(given, q.a);
  } else if(q.kind==='two'){
    const v1=($('in1').value||'').trim(), v2=($('in2').value||'').trim();
    if(v1===''||v2==='') return;
    given = 'a) '+v1+'   b) '+v2;
    ok = sameNum(v1, q.a1) && sameNum(v2, q.a2);
  } else {
    given = ($('in1').value||'').trim();
    ok = null;                       /* self-graded */
  }

  S.answered = true;
  let _v1='', _v2='';
  if(q.kind==='two'){ _v1=($('in1')||{}).value||''; _v2=($('in2')||{}).value||''; }
  S.log.push({q, given, ok, why: ok===false ? whyWrong(q, given, _v1, _v2) : ''});

  if(ok===true){ S.right++; S.auto++; tick('ok'); buzz(18); }
  else if(ok===false){ S.auto++; tick('no'); buzz([22,50,22]); }
  else tick();

  const fb=$('fb');
  fb.className = 'fb show ' + (ok===false?'no':'ok');
  if(ok===true){
    fb.innerHTML = '<b>Correct.</b>' + (S.isTest?'':esc(q.w));
  } else if(ok===false){
    let v1='', v2='';
    if(q.kind==='two'){ v1=($('in1')||{}).value||''; v2=($('in2')||{}).value||''; }
    const why = whyWrong(q, given, v1, v2);
    fb.innerHTML = '<b>Not quite.</b>The answer is <span class="ans">'+esc(q.a)+'</span>.<br>'+esc(q.w)
      + (why ? '<span class="why"><b>What went wrong:</b> '+esc(why)+'</span>' : '');
  } else {
    fb.innerHTML = '<b>Model answer</b><span class="ans">'+esc(q.a)+'</span><br>'+esc(q.w)+
                   '<br><br><span style="color:var(--dim)">Did you get the idea?</span>';
  }
  if(S.isTest && ok!==null) fb.innerHTML = '<b>Answer recorded.</b>';

  const last = S.i === S.list.length-1;
  if(ok===null && !S.isTest){
    $('acts').innerHTML = `
      <div class="row">
        <button class="btn ghost" onclick="selfGrade(false)">Missed it</button>
        <button class="btn" onclick="selfGrade(true)">Got it</button>
      </div>`;
  } else {
    $('acts').innerHTML = `<button class="btn" onclick="next()">${last?'See results':'Next'}</button>`;
  }
}

function selfGrade(good){
  const e = S.log[S.log.length-1];
  e.ok = good; S.auto++;
  if(good){ S.right++; tick('ok'); } else tick('no');
  const last = S.i === S.list.length-1;
  $('acts').innerHTML = `<button class="btn" onclick="next()">${last?'See results':'Next'}</button>`;
}

function next(){
  tick();
  S.i++;
  if(S.i >= S.list.length) return finish();
  go('run');
}

/* ---------- finish + results ---------- */
function finish(){
  const graded = S.log.filter(e=>e.ok!==null);
  const right  = graded.filter(e=>e.ok===true).length;
  bump('rounds',1);
  bump('right', right);
  raw.set('last', Date.now());
  const best = raw.get('best',{});
  const key  = S.mode;
  const scoreForBest = S.isTest ? right : right;
  if(best[key]==null || scoreForBest > best[key]) best[key] = scoreForBest;
  raw.set('best', best);
  S.finalRight = right; S.finalOf = graded.length;
  go('results');
}

function renderResults(){
  const graded = S.log.filter(e=>e.ok!==null);
  const open   = S.log.filter(e=>e.ok===null);
  const r = S.finalRight, of = S.finalOf;
  const pctv = of ? Math.round(r/of*100) : 0;
  const word = !of ? 'Mark the written ones yourself.'
             : r===of  ? 'Perfect round.'
             : pctv>=85 ? 'Strong.'
             : pctv>=70 ? 'Solid \u2014 check the misses.'
             : pctv>=50 ? 'Getting there.' : 'Worth another run.';

  /* per-section tally */
  const secs={};
  S.log.forEach(e=>{
    const s=e.q.sec; secs[s]=secs[s]||{r:0,n:0,u:0};
    secs[s].n++;
    if(e.ok===true) secs[s].r++; else if(e.ok===null) secs[s].u++;
  });
  const secRows = Object.keys(secs).sort().map(s=>{
    const v=secs[s];
    const txt = v.u===v.n ? 'check below' : v.r+'/'+(v.n-v.u);
    return `<div class="secline"><span>${SECNAME[s]}</span><span class="s">${txt}</span></div>`;
  }).join('');

  const review = S.log.map((e,idx)=>{
    const cls = e.ok===true?'right':e.ok===false?'wrong':'';
    const head = e.q.kind==='num' ? e.q.ask+' of '+e.q.q : e.q.q;
    return `<div class="rev ${cls}">
      <p class="lbl">Q${idx+1} · ${SECNAME[e.q.sec]}</p>
      <p>${esc(head)}</p>
      <p class="lbl" style="margin-top:8px">You wrote</p>
      <p style="color:${e.ok===false?'var(--bad)':'var(--ink)'}">${esc(e.given||'—')}</p>
      ${e.ok===true?'':`
        <p class="lbl" style="margin-top:8px">Answer</p>
        <p style="color:var(--acc)">${esc(e.q.a)}</p>
        <p class="muted" style="margin-top:6px">${esc(e.q.w)}</p>
        ${(function(){ const w = e.why; return w ? `<p style="margin-top:6px;color:var(--warn);font-size:13.5px">${esc(w)}</p>` : ''; })()}`}
    </div>`;
  }).join('');

  $('subline').textContent='Results';
  $('app').innerHTML = `
    <div class="score">
      <div class="n">${r}<span style="font-size:28px;color:var(--dim)">/${of}</span></div>
      <div class="of">${word}</div>
    </div>
    <div class="card">${secRows}</div>
    ${open.length && S.isTest ? `<p class="muted">${open.length} written question${open.length===1?'':'s'}
       aren't auto-graded — read the model answers below and mark them yourself.</p>`:''}
    <div class="row" style="margin:16px 0">
      <button class="btn ghost" onclick="go('home')">Menu</button>
      <button class="btn" onclick="start('${S.mode}')">Again</button>
    </div>
    <h2>Every question</h2>
    ${review}
    <div style="height:30px"></div>`;
}

/* ============================================================
   PRIME FACTOR PAD
   ============================================================ */
let scOpen=false, scAllowed=true;
function setScratch(allow){
  scAllowed = allow;
  $('scratch').style.display = allow ? '' : 'none';
  if(!allow && scOpen) toggleScratch();
}
function toggleScratch(){
  scOpen = !scOpen;
  $('scratch').classList.toggle('open', scOpen);
  $('scarrow').textContent = scOpen ? '▼' : '▲';
  $('scnote').textContent  = scOpen ? '' : 'tap to open';
  if(scOpen) setTimeout(()=>$('scin').focus(),260);
  tick();
}
function factorNow(){
  const v = parseInt($('scin').value,10);
  const out=$('scout'), chips=$('scchips');
  if(!v || v<2 || v>1000000){
    out.innerHTML='Break any number into its prime factors.';
    chips.innerHTML=''; return;
  }
  const f = primeFactors(v);
  const uniq = [];
  f.forEach(p=>{ const l=uniq[uniq.length-1]; if(l&&l[0]===p) l[1]++; else uniq.push([p,1]); });
  const powers = uniq.map(([p,c])=> c>1 ? p+'<sup>'+c+'</sup>' : ''+p).join(' × ');
  out.innerHTML =
    '<span class="pf">'+v+' = '+f.join(' × ')+'</span>' +
    (uniq.length && f.length>1 ? '<br><span style="color:var(--dim);font-size:13.5px">written short: '+powers+'</span>' : '') +
    (f.length===1 ? '<br><span style="color:var(--warn);font-size:13.5px">'+v+' is prime.</span>' : '');
  const pairs = factorPairs(v).slice(0,8);
  chips.innerHTML = '<span class="chip" style="border:0;background:none;padding-left:0">factor pairs:</span>' +
    pairs.map(([a,b])=>`<span class="chip">${a} × ${b}</span>`).join('');
}

/* ---------- boot ---------- */
renderHome();
</script>
